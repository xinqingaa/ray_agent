<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:24px;fill:#526172}.title{font-size:36px;font-weight:600}</style>
<defs><marker id="blue" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#2563eb"/></marker><marker id="gray" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#64748b"/></marker></defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f5f7f9"/>
<text x="60" y="65" class="title">当前列表更新，历史附件仍能指向原来的副本</text>
<text x="800" y="122" text-anchor="middle" class="small">简化为两次交付同步 A / B；省略文件工具产生的额外中间副本</text>
<text x="250" y="192" text-anchor="middle">动作与时刻</text>
<text x="630" y="192" text-anchor="middle">沙箱同一路径</text>
<text x="1000" y="192" text-anchor="middle">当前文件列表</text>
<text x="1360" y="192" text-anchor="middle">已保存的副本</text>
<rect x="60" y="225" width="380" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="250.0" y="268" text-anchor="middle">① 写入并交付 v1</text>
<rect x="500" y="225" width="260" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="630.0" y="268" text-anchor="middle">v1</text>
<rect x="820" y="225" width="360" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="1000.0" y="268" text-anchor="middle">指向 A</text>
<rect x="1240" y="225" width="300" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="1390.0" y="268" text-anchor="middle">A：v1</text>
<rect x="60" y="365" width="380" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="250.0" y="408" text-anchor="middle">② 覆盖，尚未同步</text>
<rect x="500" y="365" width="260" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="630.0" y="408" text-anchor="middle">v2</text>
<rect x="820" y="365" width="360" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="1000.0" y="408" text-anchor="middle">仍指向 A</text>
<rect x="1240" y="365" width="300" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="1390.0" y="408" text-anchor="middle">A：v1</text>
<rect x="60" y="505" width="380" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="250.0" y="548" text-anchor="middle">③ 同步并交付 v2</text>
<rect x="500" y="505" width="260" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="630.0" y="548" text-anchor="middle">v2</text>
<rect x="820" y="505" width="360" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1000.0" y="548" text-anchor="middle">改为指向 B</text>
<rect x="1240" y="505" width="300" height="85" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="1390.0" y="548" text-anchor="middle">A：v1；B：v2</text>
<rect x="60" y="700" width="430" height="120" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="275.0" y="743" text-anchor="middle">④ 点击第一条消息附件</text>
<text x="275.0" y="784" text-anchor="middle" class="small">历史消息保留 ID A</text>
<rect x="680" y="700" width="400" height="120" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="880.0" y="743" text-anchor="middle">按 A 下载</text>
<text x="880.0" y="784" text-anchor="middle" class="small">不查询当前列表 B</text>
<rect x="1240" y="700" width="300" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1390.0" y="743" text-anchor="middle">得到 v1</text>
<text x="1390.0" y="784" text-anchor="middle" class="small">副本 A 未改变</text>
<path d="M490 760 H680" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
<text x="585" y="736" text-anchor="middle" class="small">提供 A</text>
<path d="M1080 760 H1240" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1160" y="736" text-anchor="middle" class="small">读取 A</text>
<text x="800" y="868" text-anchor="middle" class="small">灰线：引用关系　　蓝线：内容流向</text>
</svg>
