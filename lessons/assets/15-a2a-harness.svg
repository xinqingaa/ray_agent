<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>RayAgent 怎样承接一次远程委派</title><desc>产品接入：模型读取卡片并通过统一工具委派，适配器处理 Message 或 Task，再进入本地结果与事件。</desc>
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:24px;fill:#526172}.title{font-size:36px;font-weight:600}.label{font-size:28px;font-weight:600}</style><defs>
<marker id="blue" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#2563eb"/></marker>
<marker id="green" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#16845b"/></marker>
<marker id="gray" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#748295"/></marker>
</defs><rect data-graph-role="background" width="1600" height="900" fill="#f5f7f9"/>
<text x="60" y="78" class="title" text-anchor="start">RayAgent 怎样承接一次远程委派</text>
<text x="60" y="135" class="small" text-anchor="start">当前实现：统一委派工具，非流式调用，必要时自行查询 Task</text>
<rect data-graph-role="node" x="60" y="220" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="260.0" y="270" class="label" text-anchor="middle">模型了解对端</text>
<text x="260.0" y="314" class="small" text-anchor="middle">get_remote_agent_cards</text>
<rect data-graph-role="node" x="600" y="220" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="800.0" y="270" class="label" text-anchor="middle">模型提出委派</text>
<text x="800.0" y="314" class="small" text-anchor="middle">call_remote_agent：id / query</text>
<rect data-graph-role="node" x="1140" y="220" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="1340.0" y="270" class="label" text-anchor="middle">A2A 适配器</text>
<text x="1340.0" y="314" class="small" text-anchor="middle">SendMessage 发送一次</text>
<path d="M460 280H600" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="530" y="262" class="small" text-anchor="middle">选择</text>
<path d="M1000 280H1140" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1070" y="262" class="small" text-anchor="middle">路由</text>
<rect data-graph-role="node" x="1140" y="480" width="400" height="140" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="1340.0" y="530" class="label" text-anchor="middle">处理远程响应</text>
<text x="1340.0" y="574" class="small" text-anchor="middle">Message 返回 / Task 查状态</text>
<rect data-graph-role="node" x="600" y="480" width="400" height="140" rx="8" fill="#fff" stroke="#16845b" stroke-width="3"/>
<text x="800.0" y="530" class="label" text-anchor="middle">统一工具结果</text>
<text x="800.0" y="574" class="small" text-anchor="middle">回复 / 状态 / 产物描述</text>
<rect data-graph-role="node" x="60" y="480" width="400" height="140" rx="8" fill="#fff" stroke="#16845b" stroke-width="3"/>
<text x="260.0" y="530" class="label" text-anchor="middle">本地反馈</text>
<text x="260.0" y="574" class="small" text-anchor="middle">工具消息与页面事件</text>
<path d="M1340 340V480" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="1360" y="419" class="small" text-anchor="start">响应</text>
<path d="M1140 550H1000" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="1070" y="530" class="small" text-anchor="middle">转换</text>
<path d="M600 550H460" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="530" y="530" class="small" text-anchor="middle">回传</text>
<text x="60" y="720" class="label" text-anchor="start">Task 仍在执行：查询原任务，不重新发送委托。</text>
<text x="60" y="775" class="small" text-anchor="start">远程产物先成为工具结果中的内容；文件保存与用户交付仍需另行落实。</text>
<path d="M60 845H110" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="130" y="853" class="small" text-anchor="start">请求 / 调用</text>
<path d="M390 845H440" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="460" y="853" class="small" text-anchor="start">描述 / 结果</text>
</svg>