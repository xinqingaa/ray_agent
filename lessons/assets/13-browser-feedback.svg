<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>点击已结束，价格未必已经就绪</title><desc>教学页面时间线：小杯价格39；点击大杯后旧价格仍在；价格响应到达后才得到大杯59。</desc>
<style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#172334;font-size:28px}.small{font-size:24px;fill:#526172}.title{font-size:36px;font-weight:600}.label{font-size:28px;font-weight:600}</style>
<defs><marker id="blue" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#2563eb"/></marker><marker id="green" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#16845b"/></marker></defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f5f7f9"/>
<text x="60" y="78" class="title" text-anchor="start">点击已结束，价格未必已经就绪</text>
<text x="60" y="130" class="small" text-anchor="start">教学示意；检查“规格”和“价格就绪”两项条件</text>
<rect data-graph-role="node" x="60" y="220" width="400" height="330" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="84" y="270" class="label" text-anchor="start">① 观察</text>
<path data-graph-role="decoration" d="M60 295H460" stroke="#cfdaea" stroke-width="2"/>
<text x="90" y="345" class="small" text-anchor="start">旅行杯</text>
<text x="90" y="397" class="" text-anchor="start">小杯</text>
<text x="90" y="455" class="title" text-anchor="start">¥39</text>
<text x="90" y="507" class="small" text-anchor="start">已就绪</text>
<rect data-graph-role="node" x="600" y="220" width="400" height="330" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="624" y="270" class="label" text-anchor="start">② 点击返回</text>
<path data-graph-role="decoration" d="M600 295H1000" stroke="#cfdaea" stroke-width="2"/>
<text x="630" y="345" class="small" text-anchor="start">旅行杯</text>
<text x="630" y="397" class="" text-anchor="start">正在查询大杯</text>
<text x="630" y="455" class="title" text-anchor="start">¥39</text>
<text x="630" y="507" class="small" text-anchor="start">仍是旧价格</text>
<rect data-graph-role="node" x="1140" y="220" width="400" height="330" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="1164" y="270" class="label" text-anchor="start">③ 响应到达</text>
<path data-graph-role="decoration" d="M1140 295H1540" stroke="#cfdaea" stroke-width="2"/>
<text x="1170" y="345" class="small" text-anchor="start">旅行杯</text>
<text x="1170" y="397" class="" text-anchor="start">大杯</text>
<text x="1170" y="455" class="title" text-anchor="start">¥59</text>
<text x="1170" y="507" class="small" text-anchor="start">已就绪</text>
<path d="M460 385H600" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="530" y="353" class="small" text-anchor="middle">选大杯</text>
<path d="M1000 385H1140" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1070" y="353" class="small" text-anchor="middle">价格响应</text>
<text x="60" y="630" class="label" text-anchor="start">从动作到任务，需要逐层核对</text>
<text x="60" y="680" class="" text-anchor="start">动作：点击正常返回。</text>
<text x="60" y="730" class="" text-anchor="start">页面：规格正确，价格已更新。</text>
<text x="60" y="780" class="" text-anchor="start">任务：取得的价格与详情对应用户指定的规格。</text>
<text x="60" y="850" class="small" text-anchor="start">响应失败时保留缺口；是否重试，应依据失败位置与动作副作用决定。</text>
</svg>