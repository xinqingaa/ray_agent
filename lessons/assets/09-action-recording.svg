<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:23px;fill:#526172}.title{font-size:36px;font-weight:600}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#2563eb"/></marker></defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f3f6fa"/>
<text x="60" y="75" class="title">一次动作之后，事件与 Memory 分别保存</text>
<text x="60" y="140" text-anchor="start" class="small">正常文件工具路径 · 从左向右阅读</text>
<rect x="60" y="205" width="240" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="180.0" y="247" text-anchor="middle" class="">calling 事件</text>
<text x="180.0" y="285" text-anchor="middle" class="small">发布与保存</text>
<path d="M300 265 H370" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="370" y="205" width="240" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="490.0" y="247" text-anchor="middle" class="">执行文件工具</text>
<text x="490.0" y="285" text-anchor="middle" class="small">取得写入结果</text>
<path d="M610 265 H680" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="680" y="205" width="240" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="800.0" y="247" text-anchor="middle" class="">补充文件预览</text>
<text x="800.0" y="285" text-anchor="middle" class="small">同步存储副本</text>
<path d="M920 265 H990" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="990" y="205" width="240" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="1110.0" y="247" text-anchor="middle" class="">called 事件</text>
<text x="1110.0" y="285" text-anchor="middle" class="small">发布与保存</text>
<path d="M1230 265 H1300" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1300" y="205" width="240" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1420.0" y="247" text-anchor="middle" class="">保存工具消息</text>
<text x="1420.0" y="285" text-anchor="middle" class="small">再请求模型</text>
<rect x="60" y="445" width="460" height="180" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="290" y="492" text-anchor="middle" class="">① 动作未发出</text>
<text x="290" y="543" text-anchor="middle" class="small">calling 已交接</text>
<text x="290" y="584" text-anchor="middle" class="small">本次写入尚未发生</text>
<rect x="570" y="445" width="460" height="180" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="800" y="492" text-anchor="middle" class="">② 动作已生效</text>
<text x="800" y="543" text-anchor="middle" class="small">文件可以已经存在</text>
<text x="800" y="584" text-anchor="middle" class="small">事件或 Memory 尚不齐全</text>
<rect x="1080" y="445" width="460" height="180" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="1310" y="492" text-anchor="middle" class="">③ 记录已保存</text>
<text x="1310" y="543" text-anchor="middle" class="small">页面仍可能尚未收到</text>
<text x="1310" y="584" text-anchor="middle" class="small">先查记录，不直接重做</text>
<path d="M335 300 V390" fill="none" stroke="#94a3b8" stroke-width="3"/>
<path d="M955 300 V390" fill="none" stroke="#94a3b8" stroke-width="3"/>
<text x="60" y="714" text-anchor="start" class="small">“发布与保存”内部：先写输出流，再提交数据库。</text>
<text x="60" y="761" text-anchor="start" class="small">页面可与数据库写入交错；called 已保存时，Memory 仍可能只有调用。</text>
<text x="60" y="826" text-anchor="start" class="small">窗口按所缺依据区分，不表示页面接收与所有保存拥有统一顺序。</text>
</svg>