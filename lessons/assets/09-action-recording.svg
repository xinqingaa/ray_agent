<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:23px;fill:#526172}.title{font-size:36px;font-weight:600}</style>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#2563eb"/></marker>
<marker id="arrow-gray" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#64748b"/></marker>
</defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f3f6fa"/>
<text x="60" y="75" class="title">一次动作之后，事件与 Memory 分别保存</text>
<text x="60" y="130" class="small">上排是保存顺序；竖线标出中断时缺哪一类依据</text>
<rect x="60" y="200" width="240" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="180" y="242" text-anchor="middle">calling 事件</text>
<text x="180" y="280" text-anchor="middle" class="small">发布与保存</text>
<path d="M300 255 H370" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="370" y="200" width="240" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="490" y="242" text-anchor="middle">执行文件工具</text>
<text x="490" y="280" text-anchor="middle" class="small">工作文件可能已在</text>
<path d="M610 255 H680" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="680" y="200" width="240" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="800" y="242" text-anchor="middle">补充文件预览</text>
<text x="800" y="280" text-anchor="middle" class="small">同步存储副本</text>
<path d="M920 255 H990" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="990" y="200" width="240" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="1110" y="242" text-anchor="middle">called 事件</text>
<text x="1110" y="280" text-anchor="middle" class="small">发布与保存</text>
<path d="M1230 255 H1300" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1300" y="200" width="240" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1420" y="242" text-anchor="middle">保存工具消息</text>
<text x="1420" y="280" text-anchor="middle" class="small">再请求模型</text>
<rect x="50" y="520" width="260" height="160" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="180" y="575" text-anchor="middle">① 动作未发出</text>
<text x="180" y="620" text-anchor="middle" class="small">calling 已交接</text>
<text x="180" y="655" text-anchor="middle" class="small">本次写入尚未发生</text>
<rect x="360" y="520" width="570" height="160" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="645" y="575" text-anchor="middle">② 动作已生效</text>
<text x="645" y="620" text-anchor="middle" class="small">文件可以已经存在</text>
<text x="645" y="655" text-anchor="middle" class="small">事件或 Memory 尚不齐全</text>
<rect x="980" y="520" width="570" height="160" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="1265" y="575" text-anchor="middle">③ 记录已保存</text>
<text x="1265" y="620" text-anchor="middle" class="small">页面仍可能尚未收到</text>
<text x="1265" y="655" text-anchor="middle" class="small">先查记录，不直接重做</text>
<path d="M180 310 V520" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-gray)"/>
<path d="M645 310 V520" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-gray)"/>
<path d="M1265 310 V520" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-gray)"/>
<text x="60" y="760" class="small">“发布与保存”内部：先写输出流，再提交数据库。</text>
<text x="60" y="808" class="small">页面可与数据库写入交错；called 已保存时，Memory 仍可能只有调用。</text>
<text x="60" y="856" class="small">窗口按所缺依据区分，竖线连到对应步骤，不表示所有保存拥有统一顺序。</text>
</svg>
