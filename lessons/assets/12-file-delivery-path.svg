<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:24px;fill:#526172}.title{font-size:36px;font-weight:600}</style>
<defs><marker id="blue" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#2563eb"/></marker><marker id="gray" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#64748b"/></marker></defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f5f7f9"/>
<text x="60" y="65" class="title">路径读取看工作现场，按文件 ID 下载看保存副本</text>
<rect x="60" y="210" width="370" height="160" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="245.0" y="253" text-anchor="middle">沙箱工作文件</text>
<text x="245.0" y="294" text-anchor="middle" class="small">由文件工具或 Shell 操作</text>
<text x="245.0" y="328" text-anchor="middle" class="small">路径随环境解释</text>
<rect x="600" y="180" width="400" height="220" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="800.0" y="223" text-anchor="middle">运行器同步</text>
<text x="800.0" y="264" text-anchor="middle" class="small">文件工具 called + filepath</text>
<text x="800.0" y="298" text-anchor="middle" class="small">或消息附件声明路径</text>
<text x="800.0" y="332" text-anchor="middle" class="small">从沙箱取字节并上传</text>
<rect x="1170" y="210" width="370" height="160" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1355.0" y="253" text-anchor="middle">文件存储</text>
<text x="1355.0" y="294" text-anchor="middle" class="small">文件 ID → 元数据 → 对象</text>
<text x="1355.0" y="328" text-anchor="middle" class="small">每次上传生成新 ID</text>
<path d="M430 290 H600" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="515" y="262" text-anchor="middle" class="small">取当前字节</text>
<path d="M1000 290 H1170" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1085" y="262" text-anchor="middle" class="small">上传副本</text>
<rect x="60" y="570" width="370" height="150" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="245.0" y="613" text-anchor="middle">按会话与路径读取</text>
<text x="245.0" y="654" text-anchor="middle" class="small">取得沙箱当前内容</text>
<text x="245.0" y="688" text-anchor="middle" class="small">依赖原工作环境</text>
<rect x="600" y="550" width="400" height="190" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="800.0" y="593" text-anchor="middle">访问引用</text>
<text x="800.0" y="634" text-anchor="middle" class="small">当前文件列表：当前关联 ID</text>
<text x="800.0" y="668" text-anchor="middle" class="small">历史消息附件：交付时 ID</text>
<rect x="1170" y="570" width="370" height="150" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<text x="1355.0" y="613" text-anchor="middle">按文件 ID 下载</text>
<text x="1355.0" y="654" text-anchor="middle" class="small">取得所选 ID 对应内容</text>
<text x="1355.0" y="688" text-anchor="middle" class="small">依赖元数据、对象与服务</text>
<path d="M245 370 V570" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="365" y="477" text-anchor="middle" class="small">读当前内容</text>
<path d="M1355 370 V570" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1460" y="477" text-anchor="middle" class="small">读保存副本</text>
<path d="M800 400 V550" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
<text x="945" y="477" text-anchor="middle" class="small">保存对应引用</text>
<path d="M1000 645 H1170" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
<text x="1085" y="615" text-anchor="middle" class="small">提供 ID</text>
<path d="M60 818 H125" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="217" y="827" text-anchor="middle" class="small">内容流向</text>
<path d="M370 818 H435" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
<text x="545" y="827" text-anchor="middle" class="small">引用关系</text>
<text x="1120" y="827" text-anchor="middle" class="small">环境回收影响工作文件，不自动删除存储副本</text>
</svg>
