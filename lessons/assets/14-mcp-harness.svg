<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>外部工具怎样进入 RayAgent 的主循环</title><desc>RayAgent 工具描述适配与调用路由。上半部将远端工具转换为模型声明，下半部按别名定位服务，再统一结果并进入 Memory 与事件。</desc>
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:24px;fill:#526172}.title{font-size:36px;font-weight:600}.label{font-size:28px;font-weight:600}</style><defs>
<marker id="blue" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#2563eb"/></marker>
<marker id="green" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#16845b"/></marker>
<marker id="gray" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#748295"/></marker>
</defs><rect data-graph-role="background" width="1600" height="900" fill="#f5f7f9"/>
<text x="60" y="78" class="title" text-anchor="start">外部工具怎样进入 RayAgent 的主循环</text>
<text x="60" y="133" class="small" text-anchor="start">RayAgent 当前实现；上方准备工具，下方处理一次调用</text>
<text x="60" y="198" class="label" text-anchor="start">工具准备</text>
<rect data-graph-role="node" x="60" y="230" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="260.0" y="280" class="label" text-anchor="middle">远端工具</text>
<text x="260.0" y="324" class="small" text-anchor="middle">名称 / 说明 / schema</text>
<rect data-graph-role="node" x="600" y="230" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="800.0" y="280" class="label" text-anchor="middle">声明与路由表</text>
<text x="800.0" y="324" class="small" text-anchor="middle">生成别名，保存原名</text>
<rect data-graph-role="node" x="1140" y="230" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="1340.0" y="280" class="label" text-anchor="middle">模型请求</text>
<text x="1340.0" y="324" class="small" text-anchor="middle">合并各工具箱声明</text>
<path d="M460 290H600" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="530" y="276" class="small" text-anchor="middle">发现</text>
<path d="M1000 290H1140" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="1070" y="276" class="small" text-anchor="middle">适配</text>
<text x="60" y="425" class="label" text-anchor="start">调用与反馈</text>
<rect data-graph-role="node" x="60" y="470" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="260.0" y="520" class="label" text-anchor="middle">模型选择</text>
<text x="260.0" y="564" class="small" text-anchor="middle">别名 + 参数</text>
<rect data-graph-role="node" x="600" y="470" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="800.0" y="520" class="label" text-anchor="middle">精确路由</text>
<text x="800.0" y="564" class="small" text-anchor="middle">服务键 + 原始工具名</text>
<rect data-graph-role="node" x="1140" y="470" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="1340.0" y="520" class="label" text-anchor="middle">MCP 调用</text>
<text x="1340.0" y="564" class="small" text-anchor="middle">Server 执行</text>
<path d="M460 530H600" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="530" y="516" class="small" text-anchor="middle">分发</text>
<path d="M1000 530H1140" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1070" y="516" class="small" text-anchor="middle">调用</text>
<rect data-graph-role="node" x="1140" y="670" width="400" height="110" rx="8" fill="#fff" stroke="#16845b" stroke-width="3"/>
<text x="1340.0" y="720" class="label" text-anchor="middle">统一结果</text>
<text x="1340.0" y="764" class="small" text-anchor="middle">ToolResult</text>
<rect data-graph-role="node" x="600" y="670" width="400" height="110" rx="8" fill="#fff" stroke="#16845b" stroke-width="3"/>
<text x="800.0" y="720" class="label" text-anchor="middle">Memory</text>
<text x="800.0" y="764" class="small" text-anchor="middle">工具消息 → 下次请求</text>
<rect data-graph-role="node" x="60" y="670" width="400" height="110" rx="8" fill="#fff" stroke="#16845b" stroke-width="3"/>
<text x="260.0" y="720" class="label" text-anchor="middle">工具事件</text>
<text x="260.0" y="764" class="small" text-anchor="middle">展示与历史回放</text>
<path d="M1340 590V670" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="1360" y="638" class="small" text-anchor="start">转换</text>
<path d="M1140 725H1000" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<path d="M1160 780V820H260V780" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<path d="M60 855H100" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="120" y="863" class="small" text-anchor="start">调用</text>
<path d="M300 855H340" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="360" y="863" class="small" text-anchor="start">信息</text>
</svg>