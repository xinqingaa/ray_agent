<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">记忆怎样参与下一次决策？</title>
<desc id="desc">先保存，再按当前问题找回；新观察也会成为后续可用的材料。</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#16a34a"/></marker>
<marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#9333ea"/></marker>
</defs>
<rect  data-graph-role="background" x="0" y="0" width="1600" height="900" rx="8" fill="#f8fafc" stroke="none" stroke-width="3"/>
<text x="64" y="54" font-size="18" fill="#6b7280" font-weight="400">RAYAGENT  /  05  /  02</text>
<text x="64" y="112" font-size="38" fill="#111827" font-weight="600">记忆怎样参与下一次决策？</text>
<text x="64" y="155" font-size="23" fill="#6b7280" font-weight="400">先保存，再按当前问题找回；新观察也会成为后续可用的材料。</text>
<rect  data-graph-role="node" x="64" y="320" width="344" height="242" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/>
<rect  data-graph-role="decoration" x="88" y="344" width="52" height="52" rx="8" fill="#f0fdf4" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="114" cy="358" rx="16" ry="6"/><path d="M98 358 V381 C98 390 130 390 130 381 V358 M98 370 C98 379 130 379 130 370"/></g>
<text x="156" y="380" font-size="29" fill="#111827" font-weight="600">已保存的记忆</text>
<text x="88" y="441" font-size="25" fill="#111827" font-weight="400">事实、经历、工作摘要</text>
<text x="88" y="484" font-size="23" fill="#6b7280" font-weight="400">附来源、范围与更新时间</text>
<text x="88" y="526" font-size="23" fill="#6b7280" font-weight="400">文件 / 键值 / 数据库</text>
<rect  data-graph-role="node" x="568" y="320" width="352" height="242" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/>
<rect  data-graph-role="decoration" x="592" y="344" width="52" height="52" rx="8" fill="#f0fdf4" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="615" cy="367" r="12"/><path d="M624 376 L635 387"/></g>
<text x="660" y="380" font-size="29" fill="#111827" font-weight="600">选择与检索</text>
<text x="592" y="441" font-size="25" fill="#111827" font-weight="400">围绕本次报告问题查找</text>
<text x="592" y="484" font-size="23" fill="#6b7280" font-weight="400">核对适用范围与有效性</text>
<text x="592" y="526" font-size="23" fill="#6b7280" font-weight="400">候选内容还需要筛选</text>
<rect  data-graph-role="node" x="1080" y="320" width="456" height="242" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
<rect  data-graph-role="decoration" x="1104" y="344" width="52" height="52" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1130 352 L1135 365 L1148 370 L1135 375 L1130 388 L1125 375 L1112 370 L1125 365 Z"/></g>
<text x="1172" y="380" font-size="29" fill="#111827" font-weight="600">本次决策与行动</text>
<text x="1104" y="441" font-size="25" fill="#111827" font-weight="400">选入材料 + 当前目标</text>
<text x="1104" y="484" font-size="23" fill="#6b7280" font-weight="400">模型据此判断，工具执行</text>
<text x="1104" y="526" font-size="23" fill="#6b7280" font-weight="400">获得新观察与待核实事项</text>
