<g data-graph-role="decoration" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M716 696 H744 M716 708 H744 M716 720 H736"/></g>
<text x="772" y="705" font-size="28" fill="#111827" font-weight="600">整理与更新</text>
<text x="772" y="748" font-size="22" fill="#6b7280" font-weight="400">保留来源，修正过时内容</text>
<path data-graph-role="edge" d="M1320 562 V718 H1080" fill="none" stroke="#9333ea" stroke-width="4" marker-end="url(#arrow-purple)"/>
<text x="1340" y="625" font-size="23" fill="#9333ea" font-weight="400">新记录</text>
<path data-graph-role="edge" d="M680 718 H236 V562" fill="none" stroke="#9333ea" stroke-width="4" marker-end="url(#arrow-purple)"/>
<text x="430" y="699" font-size="23" fill="#9333ea" font-weight="400">保存 / 替换 / 失效</text>
<text x="64" y="850" font-size="22" fill="#16a34a" font-weight="400">绿色：读取记忆</text>
<text x="330" y="850" font-size="22" fill="#9333ea" font-weight="400">紫色：写入记忆</text>
<text x="602" y="850" font-size="22" fill="#2563eb" font-weight="400">蓝色：当前任务</text>
<text x="958" y="850" font-size="22" fill="#6b7280" font-weight="400">通用机制示意，非产品组件图</text>
</svg>
