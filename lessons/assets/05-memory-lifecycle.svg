<text x="437" y="416" font-size="23" fill="#16a34a" font-weight="400">找回</text>
<path data-graph-role="edge" d="M920 438 H1080" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>
<text x="944" y="416" font-size="23" fill="#16a34a" font-weight="400">组装输入</text>
<text x="588" y="245" font-size="26" fill="#111827" font-weight="600">当前问题：正式版日期确定了吗？</text>
<path data-graph-role="edge" d="M744 263 V320" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="764" y="295" font-size="22" fill="#2563eb" font-weight="400">限定查找目标</text>
