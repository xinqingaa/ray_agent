<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">从用户目标到 hello.txt 交付</title><desc id="desc">任务分为接收与规划、执行与反馈、更新与交付。程序准备 Context，模型提出调用，程序调用沙箱文件工具，工具结果进入后续 Context。同一步中先写入再读取。步骤结果交回后，计划更新为一个已完成步骤，模型生成总结，程序同步附件，Web 展示文件。本图按一次真实任务简化。</desc>
