<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">课程按什么顺序展开</title>
<desc id="desc">课程按主题阶段阅读：认识闭环、一次完整任务、控制与观察、环境与交付、外部协作、验证。先读完一列再进入下一列，不绑定章号。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 Z" fill="#2563eb"/></marker>
</defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f3f6fa"/>
<text x="48" y="54" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">RAYAGENT / 课程</text>
<text x="48" y="108" font-size="38" fill="#17253b" font-weight="600" text-anchor="start">课程按什么顺序展开</text>

<rect data-graph-role="container" x="48" y="156" width="472" height="628" rx="12" fill="#edf1f6"/>
<text x="72" y="204" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">认识机制</text>
<rect id="c1" data-graph-role="node" x="78" y="248" width="412" height="200" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="284" y="300" font-size="24" fill="#17253b" font-weight="600" text-anchor="middle">认识闭环</text>
<text x="284" y="348" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">模型怎样被请求</text>
<text x="284" y="380" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">工具怎样真正执行</text>
<text x="284" y="412" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">循环如何带着上下文继续</text>
<rect id="c2" data-graph-role="node" x="78" y="528" width="412" height="200" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="284" y="580" font-size="24" fill="#17253b" font-weight="600" text-anchor="middle">一次完整任务</text>
<text x="284" y="628" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">目标如何变成可交接的步骤</text>
<text x="284" y="660" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">调用、反馈、交付串在一起</text>
<text x="284" y="692" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">再对照一次真实文件任务</text>

<rect data-graph-role="container" x="564" y="156" width="472" height="628" rx="12" fill="#eaf1fc"/>
<text x="588" y="204" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">运行与交付</text>
<rect id="c3" data-graph-role="node" x="594" y="248" width="412" height="200" rx="10" fill="#eff6ff" stroke="#8cabdb" stroke-width="3"/>
<text x="800" y="300" font-size="24" fill="#17253b" font-weight="600" text-anchor="middle">控制与观察</text>
<text x="800" y="348" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">规划、等待、取消</text>
<text x="800" y="380" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">状态保存到哪里</text>
<text x="800" y="412" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">事件能让你看见什么</text>
<rect id="c4" data-graph-role="node" x="594" y="528" width="412" height="200" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="800" y="580" font-size="24" fill="#17253b" font-weight="600" text-anchor="middle">环境与交付</text>
<text x="800" y="628" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">行动在沙箱里发生</text>
<text x="800" y="660" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">文件、浏览器、附件</text>
<text x="800" y="692" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">工作文件和下载副本不是同一份</text>

<rect data-graph-role="container" x="1080" y="156" width="472" height="628" rx="12" fill="#edf1f6"/>
<text x="1104" y="204" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">协作与验证</text>
<rect id="c5" data-graph-role="node" x="1110" y="248" width="412" height="200" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="1316" y="300" font-size="24" fill="#17253b" font-weight="600" text-anchor="middle">外部协作</text>
<text x="1316" y="348" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">MCP 接入外部工具</text>
<text x="1316" y="380" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">A2A 委派远程 Agent</text>
<text x="1316" y="412" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">接到已有执行链上</text>
<rect id="c6" data-graph-role="node" x="1110" y="528" width="412" height="200" rx="10" fill="#f5fcf8" stroke="#8bc5a9" stroke-width="3"/>
<text x="1316" y="580" font-size="24" fill="#17253b" font-weight="600" text-anchor="middle">验证</text>
<text x="1316" y="628" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">用证据核对结果</text>
<text x="1316" y="660" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">从失败里看边界</text>
<text x="1316" y="692" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">再谈一组任务如何评估</text>

<path data-graph-role="edge" id="ce12" d="M284 448 V528" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="ce23" d="M490 628 H527 V348 H594" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="ce34" d="M800 448 V528" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="ce45" d="M1006 628 H1043 V348 H1110" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="ce56" d="M1316 448 V528" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>

<text x="48" y="848" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">每列自上而下，再进入下一列</text>
<text x="1552" y="848" font-size="20" fill="#64748b" font-weight="400" text-anchor="end">阶段按主题划分，具体章节见目录</text>
</svg>
