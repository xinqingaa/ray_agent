<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">任务如何从界面走向执行？</title>
<desc id="desc">职责全景：操作产生结果，执行过程以事件回到界面。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#536579"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#0d0d0d} .secondary{fill:#6e6e80}</style>
<rect data-graph-role="background" width="1600" height="900" fill="#f3f5f7"/>
<text x="64" y="72" font-size="18" font-weight="400" text-anchor="start" style="fill:#6e6e80">RAYAGENT  /  LESSON 01</text>
<text x="64" y="130" font-size="38" font-weight="600" text-anchor="start" style="fill:#0d0d0d">任务如何从界面走向执行？</text>
<text x="64" y="174" font-size="22" font-weight="400" text-anchor="start" style="fill:#6e6e80">职责全景：操作产生结果，执行过程以事件回到界面。</text>
