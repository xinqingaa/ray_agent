<path data-graph-role="edge" d="M720 365 H840" fill="none" stroke="#536579" stroke-width="4" marker-end="url(#arrow)"/>
<path data-graph-role="edge" d="M1110 365 H1230" fill="none" stroke="#536579" stroke-width="4" marker-end="url(#arrow)"/>
