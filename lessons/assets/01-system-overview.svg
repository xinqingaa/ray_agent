<path data-graph-role="edge" d="M950 420 V585 H210 V420" fill="none" stroke="#536579" stroke-width="4" marker-end="url(#arrow)"/>
<rect data-graph-role="node" x="80" y="310" width="260" height="110" rx="8" fill="#ffffff" stroke="#8e9cac" stroke-width="3"/>
<text x="210.0" y="354" font-size="27" font-weight="600" text-anchor="middle" style="fill:#0d0d0d">用户界面</text>
<text x="210.0" y="393" font-size="20" font-weight="400" text-anchor="middle" style="fill:#71717a">发起请求 · 查看结果</text>
<rect data-graph-role="node" x="450" y="310" width="270" height="110" rx="8" fill="#ffffff" stroke="#8e9cac" stroke-width="3"/>
<text x="585.0" y="354" font-size="27" font-weight="600" text-anchor="middle" style="fill:#0d0d0d">任务准备</text>
<text x="585.0" y="393" font-size="20" font-weight="400" text-anchor="middle" style="fill:#71717a">会话 · 资源 · 运行器</text>
<rect data-graph-role="node" x="840" y="310" width="270" height="110" rx="8" fill="#ffffff" stroke="#8e9cac" stroke-width="3"/>
<rect data-graph-role="decoration" x="840" y="310" width="4" height="110" rx="2" fill="#10a37f"/>
<text x="975.0" y="354" font-size="27" font-weight="600" text-anchor="middle" style="fill:#0d0d0d">规划与执行</text>
<text x="975.0" y="393" font-size="20" font-weight="400" text-anchor="middle" style="fill:#71717a">Planner + ReAct</text>
<rect data-graph-role="node" x="1230" y="310" width="290" height="110" rx="8" fill="#ffffff" stroke="#8e9cac" stroke-width="3"/>
<text x="1375.0" y="354" font-size="27" font-weight="600" text-anchor="middle" style="fill:#0d0d0d">工具与环境</text>
<text x="1375.0" y="393" font-size="20" font-weight="400" text-anchor="middle" style="fill:#71717a">文件 · Shell · 浏览器</text>
<text x="395" y="344" font-size="20" font-weight="400" text-anchor="middle" style="fill:#71717a">请求</text>
<text x="780" y="344" font-size="20" font-weight="400" text-anchor="middle" style="fill:#71717a">运行任务</text>
<text x="1170" y="344" font-size="20" font-weight="400" text-anchor="middle" style="fill:#71717a">工具调用</text>
<text x="1220" y="475" font-size="20" font-weight="400" text-anchor="middle" style="fill:#71717a">工具结果 → 后续决策</text>
<text x="580" y="567" font-size="21" font-weight="400" text-anchor="middle" style="fill:#71717a">计划、步骤、工具与消息事件，经 API / SSE 返回</text>
<text x="64" y="675" font-size="24" font-weight="600" text-anchor="start" style="fill:#0d0d0d">贯穿任务的支持机制</text>
<rect data-graph-role="node" x="80" y="704" width="440" height="108" rx="8" fill="#ffffff" stroke="#8e9cac" stroke-width="3"/>
<text x="104" y="745" font-size="25" font-weight="600" text-anchor="start" style="fill:#0d0d0d">上下文与状态</text>
<text x="104" y="783" font-size="20" font-weight="400" text-anchor="start" style="fill:#71717a">决定下一轮输入，记录当前进展</text>
<rect data-graph-role="node" x="580" y="704" width="440" height="108" rx="8" fill="#ffffff" stroke="#8e9cac" stroke-width="3"/>
<text x="604" y="745" font-size="25" font-weight="600" text-anchor="start" style="fill:#0d0d0d">事件与历史</text>
<text x="604" y="783" font-size="20" font-weight="400" text-anchor="start" style="fill:#71717a">支持实时观察与会话历史查看</text>
<rect data-graph-role="node" x="1080" y="704" width="440" height="108" rx="8" fill="#ffffff" stroke="#8e9cac" stroke-width="3"/>
<text x="1104" y="745" font-size="25" font-weight="600" text-anchor="start" style="fill:#0d0d0d">文件与资源</text>
<text x="1104" y="783" font-size="20" font-weight="400" text-anchor="start" style="fill:#71717a">管理执行环境和可访问的产物</text>
<text x="64" y="860" font-size="20" font-weight="400" text-anchor="start" style="fill:#6e6e80">按职责分组，非部署拓扑；外部 MCP 工具和 A2A Agent 也可经工具层接入。</text>
</svg>
