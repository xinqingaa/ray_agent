<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">模型之外，谁组织任务？</title>
<desc id="desc">Harness 准备 Context 交给模型，再处理模型的调用或回答；工具结果回到 Context。状态、事件和产物支撑整个任务。职责分组不代表部署边界。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#2563eb"/></marker>
<marker id="green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#16a34a"/></marker>
</defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f3f6fa"/>
<text x="64" y="83" font-size="38" fill="#111827" font-weight="600" text-anchor="start">模型之外，谁组织任务？</text>
<text x="64" y="132" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">RAYAGENT / 01</text>
<rect data-graph-role="container" x="330" y="260" width="1220" height="530" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="365" y="310" font-size="27" fill="#2563eb" font-weight="600" text-anchor="start">Harness</text>
<path data-graph-role="edge" id="goal" d="M280 410 H400" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="request" d="M535 350 V175 H800" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="response" d="M955 230 V350" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="call" d="M1110 410 H1210" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="observation" d="M1350 470 V550 H535 V470" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#green)"/>
<rect id="user" data-graph-role="node" x="50" y="350" width="230" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="165.0" y="395" font-size="28" fill="#111827" font-weight="600" text-anchor="middle">用户</text>
<text x="165.0" y="433" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">提交任务目标</text>
<rect id="model" data-graph-role="node" x="800" y="120" width="310" height="110" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="3"/>
<text x="955.0" y="165" font-size="28" fill="#111827" font-weight="600" text-anchor="middle">Model</text>
<text x="955.0" y="203" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">提出调用或回答</text>
<rect id="context" data-graph-role="node" x="400" y="350" width="270" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="535.0" y="395" font-size="28" fill="#111827" font-weight="600" text-anchor="middle">Context</text>
<text x="535.0" y="433" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">目标 · 工具 · 已有观察</text>
<rect id="control" data-graph-role="node" x="800" y="350" width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="955.0" y="395" font-size="28" fill="#111827" font-weight="600" text-anchor="middle">执行控制</text>
<text x="955.0" y="433" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">继续 · 等待 · 结束</text>
<rect id="tools" data-graph-role="node" x="1210" y="350" width="280" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="1350.0" y="395" font-size="28" fill="#111827" font-weight="600" text-anchor="middle">工具与环境</text>
<text x="1350.0" y="433" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">写入 / 读取 hello.txt</text>
<text x="340" y="396" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">目标</text>
<text x="651" y="160" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">本次请求</text>
<text x="974" y="302" font-size="21" fill="#526174" font-weight="400" text-anchor="start">模型响应</text>
<text x="1160" y="396" font-size="20" fill="#526174" font-weight="400" text-anchor="middle">调用</text>
<text x="947" y="534" font-size="22" fill="#15803d" font-weight="400" text-anchor="middle">工具反馈：写入结果 / 读取内容</text>
<text x="365" y="607" font-size="22" fill="#526174" font-weight="400" text-anchor="start">贯穿任务的支持</text>
<rect id="state" data-graph-role="node" x="400" y="635" width="270" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="535.0" y="680" font-size="28" fill="#111827" font-weight="600" text-anchor="middle">状态</text>
<text x="535.0" y="718" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">记录任务进展</text>
<rect id="events" data-graph-role="node" x="800" y="635" width="310" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="955.0" y="680" font-size="28" fill="#111827" font-weight="600" text-anchor="middle">事件</text>
<text x="955.0" y="718" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">展示与追踪执行</text>
<rect id="artifacts" data-graph-role="node" x="1210" y="635" width="280" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="1350.0" y="680" font-size="28" fill="#111827" font-weight="600" text-anchor="middle">产物</text>
<text x="1350.0" y="718" font-size="21" fill="#526174" font-weight="400" text-anchor="middle">保存并交付 hello.txt</text>
<path data-graph-role="edge" id="legend-main" d="M64 832 H105" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="119" y="840" font-size="20" fill="#526174" font-weight="400" text-anchor="start">请求与执行</text>
<path data-graph-role="edge" id="legend-data" d="M300 832 H341" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#green)"/>
<text x="355" y="840" font-size="20" fill="#526174" font-weight="400" text-anchor="start">工具结果回传</text>
<text x="1540" y="840" font-size="20" fill="#64748b" font-weight="400" text-anchor="end">职责示意 · 非部署拓扑</text>
</svg>
