<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:23px;fill:#526172}.title{font-size:36px;font-weight:600}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#2563eb"/></marker></defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f5f7f9"/><text x="60" y="75" class="title">任务结束以后，环境仍可能继续存在</text><rect x="60" y="200" width="320" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="220" y="243" text-anchor="middle">会话 sandbox_id</text><text x="220" y="282" text-anchor="middle" class="small">准备新的任务执行</text><rect x="640" y="200" width="320" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="800" y="243" text-anchor="middle">查找运行中容器</text><text x="800" y="282" text-anchor="middle" class="small">按 ID 连接</text><path d="M380 255 H640" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="1180" y="200" width="360" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="1360" y="243" text-anchor="middle">复用环境</text><text x="1360" y="282" text-anchor="middle" class="small">原文件可以继续存在</text><path d="M960 255 H1180" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="1025" y="230" class="small">找到</text><rect x="640" y="450" width="320" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="800" y="493" text-anchor="middle">创建新容器</text><text x="800" y="532" text-anchor="middle" class="small">保存新的 sandbox_id</text><path d="M800 310 V450" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="825" y="389" class="small">找不到</text><rect x="1180" y="450" width="360" height="110" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="3"/><text x="1360" y="493" text-anchor="middle">显式 destroy</text><text x="1360" y="532" text-anchor="middle" class="small">动态容器被强制删除</text><path d="M1360 310 V450" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="1385" y="389" class="small">调用销毁</text><text x="60" y="490" class="small">任务完成 / 等待</text><text x="60" y="535" class="small">移除任务注册</text><text x="60" y="580" class="small">不自动等于删除容器</text><text x="60" y="735" class="small">新环境不是旧环境的恢复：Memory 和历史不能重建容器可写层。</text><text x="60" y="785" class="small">已有地址模式的 create / get 所有权处理不一致，销毁边界需单独核对。</text><text x="60" y="835" class="small">TTL 是另一条关闭路径；本章验证显式回收，未验证自动到期删除。</text></svg>
