<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>跟踪同一远程任务，区分中断与终态</title><desc>典型任务关系示意，不枚举全部合法状态转换。工作可以进入中断并继续，也可能到达终态。</desc>
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:24px;fill:#526172}.title{font-size:36px;font-weight:600}.label{font-size:28px;font-weight:600}</style><defs>
<marker id="blue" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#2563eb"/></marker>
<marker id="green" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#16845b"/></marker>
<marker id="gray" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#748295"/></marker>
</defs><rect data-graph-role="background" width="1600" height="900" fill="#f5f7f9"/>
<text x="60" y="78" class="title" text-anchor="start">跟踪同一远程任务，区分中断与终态</text>
<text x="60" y="135" class="small" text-anchor="start">示意采用先取得 Task 再跟踪的交互；省略直接 Message 回复</text>
<rect data-graph-role="node" x="60" y="225" width="350" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="235.0" y="275" class="label" text-anchor="middle">提交工作</text>
<text x="235.0" y="319" class="small" text-anchor="middle">取得任务标识</text>
<rect data-graph-role="node" x="580" y="225" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="780.0" y="275" class="label" text-anchor="middle">执行中</text>
<text x="780.0" y="319" class="small" text-anchor="middle">submitted / working</text>
<rect data-graph-role="node" x="1150" y="225" width="390" height="120" rx="8" fill="#fff" stroke="#16845b" stroke-width="3"/>
<text x="1345.0" y="275" class="label" text-anchor="middle">进入终态</text>
<text x="1345.0" y="319" class="small" text-anchor="middle">完成 / 失败 / 取消 / 拒绝</text>
<rect data-graph-role="node" x="580" y="540" width="400" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="780.0" y="590" class="label" text-anchor="middle">等待补充条件</text>
<text x="780.0" y="634" class="small" text-anchor="middle">input_required / auth_required</text>
<path d="M410 285H580" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="495" y="265" class="small" text-anchor="middle">跟踪</text>
<path d="M980 285H1150" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="1065" y="265" class="small" text-anchor="middle">结束</text>
<path d="M700 345V540" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="680" y="455" class="small" text-anchor="end">中断</text>
<path d="M875 540V345" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="895" y="455" class="small" text-anchor="start">补充后继续</text>
<rect data-graph-role="container" x="60" y="715" width="1480" height="90" rx="8" fill="#edf3fb" stroke="#cfdaea" stroke-width="2"/>
<text x="90" y="755" class="label" text-anchor="start">调用方的观察：GetTask 查询 / 流式更新 / 推送通知</text>
<text x="90" y="788" class="small" text-anchor="start">取得状态和产物后，仍需按委托要求检查结果；本地停止等待不改变远程状态。</text>
<path d="M60 850H110" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="130" y="858" class="small" text-anchor="start">请求 / 调用</text>
<path d="M390 850H440" fill="none" stroke="#16845b" stroke-width="4" marker-end="url(#green)"/>
<text x="460" y="858" class="small" text-anchor="start">描述 / 结果</text>
</svg>