<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:23px;fill:#526172}.title{font-size:36px;font-weight:600}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#2563eb"/></marker></defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f5f7f9"/><text x="60" y="75" class="title">工具请求最终由哪个进程执行</text><rect x="600" y="155" width="940" height="585" rx="8" fill="#f0fdf4" stroke="#bbd7c3" stroke-width="2"/><text x="630" y="197" class="small">沙箱容器：Supervisor 管理运行组件</text><rect x="60" y="250" width="340" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="230" y="293" text-anchor="middle">Shell / 文件适配</text><text x="230" y="332" text-anchor="middle" class="small">API 进程内</text><rect x="650" y="250" width="320" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="810" y="293" text-anchor="middle">FastAPI · 8080</text><text x="810" y="332" text-anchor="middle" class="small">接收工具请求</text><rect x="1140" y="250" width="340" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="1310" y="293" text-anchor="middle">文件与 Shell 服务</text><text x="1310" y="332" text-anchor="middle" class="small">文件操作 / bash 子进程</text><path d="M400 305 H650" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="468" y="280" class="small">HTTP</text><path d="M970 305 H1140" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="1005" y="280" class="small">调用</text><rect x="60" y="510" width="340" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="230" y="553" text-anchor="middle">浏览器适配</text><text x="230" y="592" text-anchor="middle" class="small">API 内的 Playwright</text><rect x="650" y="510" width="320" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="810" y="553" text-anchor="middle">CDP 代理 · 9222</text><text x="810" y="592" text-anchor="middle" class="small">转发浏览器控制</text><rect x="1140" y="510" width="340" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="1310" y="553" text-anchor="middle">Chromium</text><text x="1310" y="592" text-anchor="middle" class="small">页面与浏览器状态</text><path d="M400 565 H650" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="478" y="540" class="small">CDP</text><path d="M970 565 H1140" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="1002" y="540" class="small">8222</text><text x="630" y="695" class="small">另有虚拟显示与 VNC 画面链路；未在图中展开。</text><text x="60" y="810" class="small">API 通过 Docker Socket 创建动态容器；工具执行与环境管理属于不同权限。</text><text x="60" y="850" class="small">容器框表示资源位置。路径权限、网络访问和资源配额需分别检查。</text></svg>
