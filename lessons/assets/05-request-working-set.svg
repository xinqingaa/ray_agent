<text x="694" y="515" font-size="22" fill="#111827" font-weight="400">已经写入；读取返回 hello</text>
<rect  data-graph-role="decoration" x="676" y="544" width="488" height="66" rx="8" fill="#fff" stroke="none" stroke-width="3"/>
<text x="694" y="571" font-size="22" fill="#2563eb" font-weight="600">工具说明</text>
<text x="694" y="597" font-size="22" fill="#111827" font-weight="400">可用的读写能力与参数</text>
<rect  data-graph-role="decoration" x="676" y="626" width="488" height="66" rx="8" fill="#fff" stroke="none" stroke-width="3"/>
<text x="694" y="653" font-size="22" fill="#2563eb" font-weight="600">补充材料</text>
<text x="694" y="679" font-size="22" fill="#111827" font-weight="400">与当前步骤相关的内容</text>
<path data-graph-role="edge" d="M1196 485 H1324" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="1218" y="466" font-size="22" fill="#2563eb" font-weight="400">供推理</text>
<rect  data-graph-role="node" x="1324" y="399" width="212" height="172" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/>
<rect  data-graph-role="decoration" x="1404" y="419" width="52" height="52" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1430 427 L1435 440 L1448 445 L1435 450 L1430 463 L1425 450 L1412 445 L1425 440 Z"/></g>
<text x="1376" y="516" font-size="30" fill="#111827" font-weight="600">模型</text>
<text x="1360" y="550" font-size="22" fill="#6b7280" font-weight="400">提出下一步</text>
<text x="64" y="819" font-size="26" fill="#111827" font-weight="600">路径提供定位线索；读取结果才提供文件内容。</text>
<text x="64" y="860" font-size="22" fill="#6b7280" font-weight="400">逻辑分组示意：不对应固定 API 字段，也不表示所有已保存内容都会选入。</text>
</svg>
