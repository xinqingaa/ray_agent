<text x="694" y="325" font-size="22" fill="#2563eb" font-weight="600">行为要求</text>
<text x="694" y="351" font-size="22" fill="#111827" font-weight="400">写入后读取确认</text>
<rect  data-graph-role="decoration" x="676" y="380" width="488" height="66" rx="8" fill="#fff" stroke="none" stroke-width="3"/>
<text x="694" y="407" font-size="22" fill="#2563eb" font-weight="600">用户目标</text>
<text x="694" y="433" font-size="22" fill="#111827" font-weight="400">创建文件并报告内容</text>
<rect  data-graph-role="decoration" x="676" y="462" width="488" height="66" rx="8" fill="#fff" stroke="none" stroke-width="3"/>
