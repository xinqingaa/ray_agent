<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Context：一次调用的信息快照</title>
<desc id="desc">示意时刻：hello.txt 已读取，模型准备根据结果回答。</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#16a34a"/></marker>
<marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#9333ea"/></marker>
</defs>
<rect  data-graph-role="background" x="0" y="0" width="1600" height="900" rx="8" fill="#f8fafc" stroke="none" stroke-width="3"/>
<text x="64" y="54" font-size="18" fill="#6b7280" font-weight="400">RAYAGENT  /  05  /  01</text>
<text x="64" y="112" font-size="38" fill="#111827" font-weight="600">Context：一次调用的信息快照</text>
<text x="64" y="165" font-size="24" fill="#6b7280" font-weight="400">示意时刻：文件已读取，准备回答</text>
<rect  data-graph-role="node" x="64" y="218" width="1084" height="530" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/>
<text x="96" y="262" font-size="23" fill="#6b7280" font-weight="400">信息来源</text>
<text x="352" y="262" font-size="25" fill="#111827" font-weight="600">进入本次 Context 的内容</text>
<rect  data-graph-role="decoration" x="88" y="288" width="1036" height="76" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<rect  data-graph-role="decoration" x="104" y="300" width="52" height="52" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="130" cy="326" r="16"/><circle cx="130" cy="326" r="7"/></g>
<text x="176" y="335" font-size="27" fill="#111827" font-weight="600">指令</text>
<text x="352" y="335" font-size="26" fill="#111827" font-weight="400">写入后读取确认。</text>
<rect  data-graph-role="decoration" x="88" y="376" width="1036" height="76" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<rect  data-graph-role="decoration" x="104" y="388" width="52" height="52" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="130" cy="414" r="16"/><circle cx="130" cy="414" r="7"/></g>
<text x="176" y="423" font-size="27" fill="#111827" font-weight="600">用户目标</text>
<text x="352" y="423" font-size="26" fill="#111827" font-weight="400">创建 hello.txt，写入 hello，再报告内容。</text>
<rect  data-graph-role="decoration" x="88" y="464" width="1036" height="76" rx="8" fill="#f0fdf4" stroke="none" stroke-width="3"/>
<rect  data-graph-role="decoration" x="104" y="476" width="52" height="52" rx="8" fill="#f0fdf4" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M116 490 H144 M116 502 H144 M116 514 H136"/></g>
<text x="176" y="511" font-size="27" fill="#111827" font-weight="600">历史行动</text>
<text x="352" y="511" font-size="26" fill="#111827" font-weight="400">write_file → 成功；read_file → 已执行</text>
<rect  data-graph-role="decoration" x="88" y="552" width="1036" height="76" rx="8" fill="#f0fdf4" stroke="none" stroke-width="3"/>
<rect  data-graph-role="decoration" x="104" y="564" width="52" height="52" rx="8" fill="#f0fdf4" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M119 574 H135 L143 582 V606 H119 Z M135 574 V582 H143 M125 590 H137 M125 597 H137"/></g>
<text x="176" y="599" font-size="27" fill="#111827" font-weight="600">工具观察</text>
<text x="352" y="599" font-size="26" fill="#111827" font-weight="400">hello.txt 的内容是 &quot;hello&quot;</text>
<rect  data-graph-role="decoration" x="88" y="640" width="1036" height="76" rx="8" fill="#faf5ff" stroke="none" stroke-width="3"/>
<rect  data-graph-role="decoration" x="104" y="652" width="52" height="52" rx="8" fill="#faf5ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M119 662 H135 L143 670 V694 H119 Z M135 662 V670 H143 M125 678 H137 M125 685 H137"/></g>
<text x="176" y="687" font-size="27" fill="#111827" font-weight="600">工具说明</text>
<text x="352" y="687" font-size="26" fill="#111827" font-weight="400">write_file / read_file 的用途与参数</text>
<path data-graph-role="edge" d="M1148 483 H1284" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="1180" y="462" font-size="23" fill="#2563eb" font-weight="400">输入</text>
<rect  data-graph-role="node" x="1284" y="364" width="252" height="238" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
<rect  data-graph-role="decoration" x="1384" y="388" width="52" height="52" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1410 396 L1415 409 L1428 414 L1415 419 L1410 432 L1405 419 L1392 414 L1405 409 Z"/></g>
<text x="1360" y="477" font-size="33" fill="#111827" font-weight="600">Model</text>
<text x="1312" y="533" font-size="25" fill="#6b7280" font-weight="400">可据读取结果</text>
<text x="1338" y="569" font-size="25" fill="#6b7280" font-weight="400">报告内容</text>
<text x="64" y="824" font-size="26" fill="#111827" font-weight="400">写入改变文件；读取结果进入 Context，模型才有内容确认的依据。</text>
</svg>
