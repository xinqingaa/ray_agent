<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M100 449 H128 M100 461 H128 M100 473 H120"/></g>
<text x="158" y="469" font-size="27" fill="#111827" font-weight="600">历史与已保存记录</text>
<text x="88" y="524" font-size="24" fill="#6b7280" font-weight="400">写入调用、成功结果</text>
<path data-graph-role="edge" d="M484 484 H644" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="512" y="466" font-size="22" fill="#2563eb" font-weight="400">选入</text>
<rect  data-graph-role="node" x="64" y="602" width="420" height="144" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/>
<rect  data-graph-role="decoration" x="88" y="625" width="52" height="52" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M103 635 H119 L127 643 V667 H103 Z M119 635 V643 H127 M109 651 H121 M109 658 H121"/></g>
<text x="158" y="659" font-size="27" fill="#111827" font-weight="600">按需取得的材料</text>
<text x="88" y="714" font-size="24" fill="#6b7280" font-weight="400">读取 hello.txt → 得到正文</text>
<path data-graph-role="edge" d="M484 674 H644" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="512" y="656" font-size="22" fill="#2563eb" font-weight="400">选入</text>
