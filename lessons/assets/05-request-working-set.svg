<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="114" cy="271" r="16"/><circle cx="114" cy="271" r="7"/></g>
<text x="158" y="279" font-size="27" fill="#111827" font-weight="600">指令、目标与工具</text>
<text x="88" y="334" font-size="24" fill="#6b7280" font-weight="400">目标、执行要求、工具说明</text>
