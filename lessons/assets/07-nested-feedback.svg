<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172334;font-size:28px}.small{font-size:23px;fill:#526172}</style>
<defs>
<marker id="blue" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#2563eb"/></marker>
<marker id="green" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7Z" fill="#16a34a"/></marker>
</defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f3f6fa"/>
<text x="90" y="70" text-anchor="start">外层推进步骤，内层完成当前步骤</text>
<text x="90" y="133" text-anchor="start" class="small">外层 · 已创建计划</text>
<path d="M390 248 H550" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path d="M820 248 H980" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="470" y="226" text-anchor="middle" class="small">有下一步</text>
<text x="900" y="226" text-anchor="middle" class="small">步骤结果</text>
<path d="M1115 291 V350 H255 V291" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="685" y="386" text-anchor="middle" class="small">更新后，再选步骤</text>
<path d="M255 205 V170 H1380 V205" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1090" y="157" text-anchor="middle" class="small">没有下一步 → 总结</text>
<rect x="120" y="205" width="270" height="86" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
<text x="255" y="258" text-anchor="middle">选择步骤</text>
<rect x="550" y="205" width="270" height="86" rx="8" fill="white" stroke="#2563eb" stroke-width="3"/>
<text x="685" y="258" text-anchor="middle">执行步骤</text>
<rect x="980" y="205" width="270" height="86" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
<text x="1115" y="258" text-anchor="middle">更新计划</text>
<rect x="1300" y="205" width="160" height="86" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
<text x="1380" y="258" text-anchor="middle">总结</text>
<line x1="90" y1="447" x2="1510" y2="447" stroke="#cbd5e1" stroke-width="2"/>
<text x="90" y="506" text-anchor="start" class="small">内层 · 展开上方的“执行步骤”</text>
<path d="M390 635 H550" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#green)"/>
<path d="M820 635 H980" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#green)"/>
<text x="470" y="613" text-anchor="middle" class="small">工具调用</text>
<text x="900" y="613" text-anchor="middle" class="small">工具结果</text>
<path d="M1115 678 V740 H255 V678" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#green)"/>
<text x="685" y="781" text-anchor="middle" class="small">带着新观察，再请求模型</text>
<path d="M255 592 V545 H1380 V592" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#green)"/>
<text x="1090" y="532" text-anchor="middle" class="small">不再调用工具 → 交回步骤结果</text>
<rect x="120" y="592" width="270" height="86" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
<text x="255" y="645" text-anchor="middle">请求模型</text>
<rect x="550" y="592" width="270" height="86" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
<text x="685" y="645" text-anchor="middle">执行工具</text>
<rect x="980" y="592" width="270" height="86" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
<text x="1115" y="645" text-anchor="middle">回传结果</text>
<rect x="1300" y="592" width="160" height="86" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
<text x="1380" y="645" text-anchor="middle">返回</text>
<text x="90" y="854" text-anchor="start" class="small">蓝色：步骤间推进    绿色：步骤内反馈 · 仅展示正常路径</text>
</svg>