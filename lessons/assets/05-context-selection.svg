<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">同一段资料，怎样放入 Context？</title>
<desc id="desc">同一段资料，比较直接保留、摘要与外置后读取。</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#16a34a"/></marker>
<marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#9333ea"/></marker>
</defs>
<rect  data-graph-role="background" x="0" y="0" width="1600" height="900" rx="8" fill="#f8fafc" stroke="none" stroke-width="3"/>
<text x="64" y="54" font-size="18" fill="#6b7280" font-weight="400">RAYAGENT  /  05  /  03</text>
<text x="64" y="112" font-size="38" fill="#111827" font-weight="600">同一段资料，怎样放入 Context？</text>
<rect  data-graph-role="node" x="64" y="186" width="1472" height="112" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/>
<rect  data-graph-role="decoration" x="88" y="212" width="52" height="52" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M103 222 H119 L127 230 V254 H103 Z M119 222 V230 H127 M109 238 H121 M109 245 H121"/></g>
<text x="164" y="226" font-size="24" fill="#6b7280" font-weight="400">资料 A · 交付安排</text>
<text x="164" y="269" font-size="28" fill="#111827" font-weight="400">初稿 6 月 10 日交付；正式版 6 月 20 日发布，前提是评审通过。</text>
<text x="88" y="346" font-size="23" fill="#6b7280" font-weight="400">处理方式</text>
<text x="396" y="346" font-size="23" fill="#6b7280" font-weight="400">本次 Context</text>
<text x="1180" y="346" font-size="23" fill="#6b7280" font-weight="400">取舍</text>
<rect  data-graph-role="container" x="64" y="374" width="1472" height="144" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="3"/>
<rect  data-graph-role="decoration" x="88" y="406" width="52" height="52" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M103 416 H119 L127 424 V448 H103 Z M119 416 V424 H127 M109 432 H121 M109 439 H121"/></g>
<text x="164" y="446" font-size="28" fill="#111827" font-weight="600">保留原文</text>
<path data-graph-role="edge" d="M294 446 H374" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect  data-graph-role="decoration" x="396" y="394" width="724" height="104" rx="8" fill="#eff6ff" stroke="none" stroke-width="3"/>
<text x="416" y="431" font-size="25" fill="#111827" font-weight="400">初稿 6 月 10 日交付；正式版 6 月 20 日发布，</text>
<text x="416" y="473" font-size="25" fill="#111827" font-weight="400">前提是评审通过。</text>
<text x="1180" y="433" font-size="27" fill="#111827" font-weight="600">细节完整</text>
<text x="1180" y="475" font-size="24" fill="#6b7280" font-weight="400">输入占用较多</text>
<rect  data-graph-role="container" x="64" y="540" width="1472" height="144" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="3"/>
<rect  data-graph-role="decoration" x="88" y="572" width="52" height="52" rx="8" fill="#faf5ff" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M100 586 H128 M100 598 H128 M100 610 H120"/></g>
<text x="164" y="612" font-size="28" fill="#111827" font-weight="600">摘要</text>
<path data-graph-role="edge" d="M294 612 H374" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect  data-graph-role="decoration" x="396" y="560" width="724" height="104" rx="8" fill="#faf5ff" stroke="none" stroke-width="3"/>
<text x="416" y="597" font-size="26" fill="#111827" font-weight="400">正式版暂定 6/20，须评审通过。</text>
<text x="416" y="639" font-size="23" fill="#6b7280" font-weight="400">来源：资料 A · 评审结果待查</text>
<text x="1180" y="599" font-size="27" fill="#111827" font-weight="600">提炼关键内容</text>
<text x="1180" y="641" font-size="24" fill="#6b7280" font-weight="400">可能遗漏细节</text>
<rect  data-graph-role="container" x="64" y="706" width="1472" height="144" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="3"/>
<rect  data-graph-role="decoration" x="88" y="738" width="52" height="52" rx="8" fill="#f0fdf4" stroke="none" stroke-width="3"/>
<g data-graph-role="decoration" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="111" cy="761" r="12"/><path d="M120 770 L131 781"/></g>
<text x="164" y="778" font-size="28" fill="#111827" font-weight="600">按需读取</text>
<path data-graph-role="edge" d="M294 778 H374" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect  data-graph-role="decoration" x="396" y="726" width="724" height="104" rx="8" fill="#f0fdf4" stroke="none" stroke-width="3"/>
<text x="416" y="763" font-size="26" fill="#111827" font-weight="400">资料 A → 交付安排</text>
<text x="416" y="805" font-size="23" fill="#6b7280" font-weight="400">需要日期时，再读取对应段落</text>
<text x="1180" y="765" font-size="27" fill="#111827" font-weight="600">原文留在外部</text>
<text x="1180" y="807" font-size="24" fill="#6b7280" font-weight="400">增加一次读取</text>
</svg>
