# RayAgent 模型连接配置示例。
#
# 复制到 ~/.config/rayagent/config.toml（或用环境变量 RAYAGENT_CONFIG 另指位置），填好后执行 chmod 600。
# 核心按修改时间重新读取，保存后新运行即用新值，无需重启。设置页只显示地址、密钥掩码与可用模型。
#
# 每个 [providers.<名称>] 是一个 OpenAI 兼容接口：
#   base_url  接口基础地址
#   api_key   密钥；留空时模型仍可选择，发送前会提示未配置 API Key
#   protocol  responses（默认）或 chat_completions
#   models    由它提供的模型，只能使用内置模型目录中的 id，同一模型只能由一个提供商提供
# 内置模型：deepseek-flash、deepseek-v4-pro、gpt-6.1-sol、gpt-6-luna、gpt-6-astra

[providers.deepseek]
base_url = "https://api.deepseek.com"
api_key = ""
protocol = "chat_completions"
models = ["deepseek-flash", "deepseek-v4-pro"]

