<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RayAgent 宿主探针</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>宿主探针</h1>
        <span id="state" class="state" data-state="loading">读取中</span>
      </header>

      <section aria-labelledby="core-title">
        <h2 id="core-title">核心</h2>
        <dl>
          <dt>端口</dt>
          <dd id="port" class="mono">—</dd>
          <dt>进程</dt>
          <dd id="pid" class="mono">—</dd>
          <dt>启动到握手</dt>
          <dd id="startup" class="num">—</dd>
          <dt>构建</dt>
          <dd id="build" class="mono">—</dd>
          <dt>健康检查</dt>
          <dd id="health">—</dd>
        </dl>
        <p id="detail" class="detail" role="status"></p>
      </section>

      <section aria-labelledby="chat-title">
        <h2 id="chat-title">普通会话</h2>
        <div class="row">
          <button id="run" type="button" disabled>发起一次会话</button>
          <span id="chat-state" class="muted" role="status"></span>
        </div>
        <pre id="reply" class="reply" hidden></pre>
      </section>

      <section aria-labelledby="log-title">
        <h2 id="log-title">核心日志</h2>
        <pre id="logs" class="logs"></pre>
      </section>
    </main>
  </body>
</html>
