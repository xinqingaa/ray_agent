[package]
name = "rayagent-desktop"
version = "0.1.0"
description = "RayAgent desktop host"
edition = "2021"
publish = false

[lib]
name = "rayagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
