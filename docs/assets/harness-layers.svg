<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Harness 职责分层</title>
  <desc id="desc">编排、计划清单、单循环决策、工具契约与执行适配五层，观测和状态贯穿其中。</desc>
  <style>text { font-family: 'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Songti SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif; }</style>
  <defs>
    <marker id="arr-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#2563eb"/></marker><marker id="arr-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#16a34a"/></marker><marker id="arr-ea580c" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#ea580c"/></marker><marker id="arr-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#dc2626"/></marker><marker id="arr-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#7c3aed"/></marker><marker id="arr-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#475569"/></marker><marker id="arr-6b7280" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff" data-graph-role="background"/>
  <text x="40" y="36" fill="#16a34a" font-size="14" font-weight="600">RAYAGENT ／ HARNESS 职责分层</text>
  <text x="40" y="70" fill="#111827" font-size="28" font-weight="700">哪些职责被从模型里分出来</text>
  <rect x="36" y="164" width="400" height="546" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="52" y="186" fill="#16a34a" font-size="13" font-weight="600">贯穿各层 · 观测与控制</text>
  <rect x="1164" y="164" width="400" height="546" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="1180" y="186" fill="#16a34a" font-size="13" font-weight="600">贯穿各层 · 状态与持久化</text>
  <rect x="500" y="100" width="600" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="in"/>
  <text x="516" y="130.0" fill="#111827" font-size="16" font-weight="600">用户目标与控制请求</text>
  <rect x="476" y="176" width="648" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="orch"/>
  <rect x="484" y="188" width="6" height="54" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="504" y="208" fill="#111827" font-size="18" font-weight="600">会话与任务编排</text>
  <text x="504" y="232" fill="#6b7280" font-size="15">按资源归属准备，启动、续接或停止</text>
  <rect x="476" y="286" width="648" height="78" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="plan"/>
  <rect x="484" y="298" width="6" height="54" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="504" y="318" fill="#111827" font-size="18" font-weight="600">计划清单</text>
  <text x="504" y="342" fill="#6b7280" font-size="15">update_plan 提交全表；只展示，不调度</text>
  <path d="M 800.0 254.0 L 800.0 286.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <rect x="476" y="396" width="648" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="decide"/>
  <rect x="484" y="408" width="6" height="54" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="504" y="428" fill="#111827" font-size="18" font-weight="600">决策 · 单循环</text>
  <text x="504" y="452" fill="#6b7280" font-size="15">检查容量；有限结束反馈后答复</text>
  <path d="M 800.0 364.0 L 800.0 396.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <rect x="476" y="506" width="648" height="78" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="contract"/>
  <rect x="484" y="518" width="6" height="54" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="504" y="538" fill="#111827" font-size="18" font-weight="600">工具契约</text>
  <text x="504" y="562" fill="#6b7280" font-size="15">校验后按 allow / ask / deny；再执行、整形</text>
  <path d="M 800.0 474.0 L 800.0 506.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <rect x="476" y="616" width="648" height="78" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3.5" data-graph-role="node" data-node-id="adapt"/>
  <rect x="484" y="628" width="6" height="54" rx="3" fill="#7c3aed" data-graph-role="decoration"/>
  <text x="504" y="648" fill="#111827" font-size="18" font-weight="600">执行适配</text>
  <text x="504" y="672" fill="#6b7280" font-size="15">沙箱文件与 Shell、浏览器、检索、MCP、A2A</text>
  <path d="M 800.0 584.0 L 800.0 616.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <rect x="500" y="742" width="600" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="out"/>
  <rect x="508" y="754" width="6" height="24" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="528" y="772.0" fill="#111827" font-size="16" font-weight="600">结果、产物与可回看的过程</text>
  <path d="M 800.0 148.0 L 800.0 176.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <path d="M 800.0 694.0 L 800.0 742.0" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-16a34a)" data-graph-role="edge"/>
  <rect x="56" y="208" width="360" height="112" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="l-事件与投影"/>
  <rect x="64" y="220" width="6" height="88" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="84" y="240" fill="#111827" font-size="16" font-weight="600">事件与投影</text>
  <text x="84" y="264" fill="#6b7280" font-size="13">先按 seq 落库，再通知</text>
  <text x="84" y="285" fill="#6b7280" font-size="13">SSE 可续传；增量不落库</text>
  <rect x="56" y="348" width="360" height="112" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="l-用户参与"/>
  <rect x="64" y="360" width="6" height="88" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="84" y="380" fill="#111827" font-size="16" font-weight="600">用户参与</text>
  <text x="84" y="404" fill="#6b7280" font-size="13">提问、审批、补充输入</text>
  <text x="84" y="425" fill="#6b7280" font-size="13">停止会取消本次运行</text>
  <rect x="56" y="488" width="360" height="112" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="l-预算与中止"/>
  <rect x="64" y="500" width="6" height="88" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="84" y="520" fill="#111827" font-size="16" font-weight="600">预算与中止</text>
  <text x="84" y="544" fill="#6b7280" font-size="13">请求数按一次运行累计</text>
  <text x="84" y="565" fill="#6b7280" font-size="13">停止再终止沙箱进程组</text>
  <rect x="1184" y="208" width="360" height="112" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="r-本次请求内"/>
  <rect x="1192" y="220" width="6" height="88" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="1212" y="240" fill="#111827" font-size="16" font-weight="600">本次请求内</text>
  <text x="1212" y="264" fill="#6b7280" font-size="13">Context 对象与临时增量</text>
  <text x="1212" y="285" fill="#6b7280" font-size="13">对象不持久；记录可重建</text>
  <rect x="1184" y="348" width="360" height="112" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="r-当前进程内"/>
  <rect x="1192" y="360" width="6" height="88" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="1212" y="380" fill="#111827" font-size="16" font-weight="600">当前进程内</text>
  <text x="1212" y="404" fill="#6b7280" font-size="13">协程、锁与 Shell 登记</text>
  <text x="1212" y="425" fill="#6b7280" font-size="13">重启不自动接着执行</text>
  <rect x="1184" y="488" width="360" height="112" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="r-进程之外"/>
  <rect x="1192" y="500" width="6" height="88" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="1212" y="520" fill="#111827" font-size="16" font-weight="600">进程之外</text>
  <text x="1212" y="544" fill="#6b7280" font-size="13">runs、events 与工作文件</text>
  <text x="1212" y="565" fill="#6b7280" font-size="13">能再读到，不等于能续跑</text>
  <path d="M40 792 H1560" fill="none" stroke="#e5e7eb" stroke-width="2" data-graph-role="decoration"/>
  <text x="40" y="820" fill="#6b7280" font-size="14">模型只做一次判断。把判断变成可继续、可打断、可回看的任务，是 Harness 的职责。</text>
</svg>
