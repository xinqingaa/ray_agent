  <text x="668" y="487" fill="#20312f" font-size="22" font-weight="600" text-anchor="start">流程局部状态</text>
  <rect x="1072" y="150" width="464" height="392" rx="12" fill="#edf6ef" stroke="#a9c9b4" stroke-width="2" data-graph-role="container" />
  <text x="1096" y="196" fill="#20312f" font-size="28" font-weight="650" text-anchor="start">进程之外</text>
  <text x="1096" y="230" fill="#177b65" font-size="20" font-weight="400" text-anchor="start">能重新读到，但不等于能继续执行</text>
  <rect x="1096" y="256" width="416" height="76" rx="10" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
