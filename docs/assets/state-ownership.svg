    <path d="M14 2V7H19" />
    <path d="M8 12H16" />
    <path d="M8 16H14" />
  </g>
  <text x="1172" y="487" fill="#20312f" font-size="22" font-weight="600" text-anchor="start">工作文件与附件</text>
  <text x="64" y="610" fill="#20312f" font-size="28" font-weight="650" text-anchor="start">进程之外的数据还要再分三类，它们的可恢复性完全不同</text>
  <rect x="64" y="640" width="464" height="172" rx="12" fill="#ffffff" stroke="#dcc79c" stroke-width="2" data-graph-role="node" />
  <rect x="64" y="640" width="8" height="172" rx="4" fill="#97691f" stroke="#97691f" stroke-width="0" data-graph-role="node" />
  <text x="96" y="690" fill="#97691f" font-size="26" font-weight="650" text-anchor="start">引用</text>
  <text x="96" y="724" fill="#20312f" font-size="21" font-weight="600" text-anchor="start">ID 指向外部资源</text>
  <text x="96" y="760" fill="#536965" font-size="20" font-weight="400" text-anchor="start">记录里存着 sandbox_id，</text>
  <text x="96" y="790" fill="#536965" font-size="20" font-weight="400" text-anchor="start">不代表那个容器还在</text>
  <rect x="568" y="640" width="464" height="172" rx="12" fill="#ffffff" stroke="#a9c9b4" stroke-width="2" data-graph-role="node" />
  <rect x="568" y="640" width="8" height="172" rx="4" fill="#177b65" stroke="#177b65" stroke-width="0" data-graph-role="node" />
  <text x="600" y="690" fill="#177b65" font-size="26" font-weight="650" text-anchor="start">快照</text>
  <text x="600" y="724" fill="#20312f" font-size="21" font-weight="600" text-anchor="start">记录是某一刻的样子</text>
  <text x="600" y="760" fill="#536965" font-size="20" font-weight="400" text-anchor="start">事件历史能完整回放，</text>
  <text x="600" y="790" fill="#536965" font-size="20" font-weight="400" text-anchor="start">不代表执行能从中断处继续</text>
  <rect x="1072" y="640" width="464" height="172" rx="12" fill="#ffffff" stroke="#e2bcbc" stroke-width="2" data-graph-role="node" />
  <rect x="1072" y="640" width="8" height="172" rx="4" fill="#bd5254" stroke="#bd5254" stroke-width="0" data-graph-role="node" />
  <text x="1104" y="690" fill="#bd5254" font-size="26" font-weight="650" text-anchor="start">真实副作用</text>
  <text x="1104" y="724" fill="#20312f" font-size="21" font-weight="600" text-anchor="start">文件已经被改变</text>
  <text x="1104" y="760" fill="#536965" font-size="20" font-weight="400" text-anchor="start">取消和失败都不会回滚，</text>
  <text x="1104" y="790" fill="#536965" font-size="20" font-weight="400" text-anchor="start">重试可能重复产生同样的修改</text>
  <path d="M64 860 L1536 860" fill="none" stroke="#c6d5d0" stroke-width="2" data-graph-role="decoration" />
  <text x="64" y="898" fill="#536965" font-size="22" font-weight="400" text-anchor="start">保存和恢复是两个问题：RayAgent 做到了保存与回放，从中断处继续执行还需要检查点与执行所有权。</text>
</svg>
