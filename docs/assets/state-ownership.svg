  <rect x="0" y="0" width="1600" height="950" fill="#fafcfb" data-graph-role="background" />
  <text x="64" y="44" fill="#177b65" font-size="18" font-weight="600" text-anchor="start">RAYAGENT ／ 状态归属</text>
  <text x="64" y="94" fill="#20312f" font-size="40" font-weight="650" text-anchor="start">执行中的信息归谁，能活多久</text>
