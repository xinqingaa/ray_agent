  <text x="592" y="196" fill="#20312f" font-size="28" font-weight="650" text-anchor="start">当前进程内</text>
  <text x="592" y="230" fill="#97691f" font-size="20" font-weight="400" text-anchor="start">进程重启即丢失，别的进程看不到</text>
  <rect x="592" y="256" width="416" height="76" rx="10" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
