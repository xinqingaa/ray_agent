  </g>
  <text x="1172" y="395" fill="#20312f" font-size="22" font-weight="600" text-anchor="start">Redis 流消息</text>
  <rect x="1096" y="440" width="416" height="76" rx="10" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <g transform="translate(1118 452) scale(1.3)" fill="none" stroke="#177b65" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
