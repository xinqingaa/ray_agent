<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">状态与资源归属</title>
  <desc id="desc">请求内、进程内与进程外三层寿命，以及引用、快照和真实副作用。</desc>
  <style>text { font-family: 'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Songti SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif; }</style>
  <defs>
    <marker id="arr-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#2563eb"/></marker><marker id="arr-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#16a34a"/></marker><marker id="arr-ea580c" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#ea580c"/></marker><marker id="arr-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#dc2626"/></marker><marker id="arr-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#7c3aed"/></marker><marker id="arr-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#475569"/></marker><marker id="arr-6b7280" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff" data-graph-role="background"/>
  <text x="40" y="36" fill="#16a34a" font-size="14" font-weight="600">RAYAGENT ／ 状态归属</text>
  <text x="40" y="70" fill="#111827" font-size="28" font-weight="700">执行中的信息归谁，能活多久</text>
  <rect x="40" y="104" width="480" height="400" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="60" y="136" fill="#111827" font-size="20" font-weight="700">本次请求内</text>
  <text x="60" y="160" fill="#2563eb" font-size="13">装配对象不持久，已记录请求可重建</text>
  <rect x="56" y="184" width="448" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="本次请求内-Context 装配结果"/>
  <rect x="64" y="196" width="6" height="68" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="84" y="216" fill="#111827" font-size="16" font-weight="600">Context 装配结果</text>
  <text x="84" y="240" fill="#6b7280" font-size="14">这一次发给模型的消息序列</text>
  <rect x="56" y="288" width="448" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="本次请求内-本轮容量估算"/>
  <rect x="64" y="300" width="6" height="68" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="84" y="320" fill="#111827" font-size="16" font-weight="600">本轮容量估算</text>
  <text x="84" y="344" fill="#6b7280" font-size="14">随轮次记录，决定压缩或拒绝</text>
  <rect x="56" y="392" width="448" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="本次请求内-页面投影与文本增量"/>
  <rect x="64" y="404" width="6" height="68" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="84" y="424" fill="#111827" font-size="16" font-weight="600">页面投影与文本增量</text>
  <text x="84" y="448" fill="#6b7280" font-size="14">增量无序号，刷新后不在</text>
  <rect x="560" y="104" width="480" height="400" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="580" y="136" fill="#111827" font-size="20" font-weight="700">当前进程内</text>
  <text x="580" y="160" fill="#ea580c" font-size="13">进程重启即丢失，别的进程看不到</text>
  <rect x="576" y="184" width="448" height="92" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="当前进程内-执行协程与任务注册表"/>
  <rect x="584" y="196" width="6" height="68" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="604" y="216" fill="#111827" font-size="16" font-weight="600">执行协程与任务注册表</text>
  <text x="604" y="240" fill="#6b7280" font-size="14">正在跑的那一次运行</text>
  <rect x="576" y="288" width="448" height="92" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="当前进程内-会话锁与循环局部状态"/>
  <rect x="584" y="300" width="6" height="68" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="604" y="320" fill="#111827" font-size="16" font-weight="600">会话锁与循环局部状态</text>
  <text x="604" y="344" fill="#6b7280" font-size="14">只在本进程内有效</text>
  <rect x="576" y="392" width="448" height="92" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="当前进程内-已登记的 Shell 会话"/>
  <rect x="584" y="404" width="6" height="68" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="604" y="424" fill="#111827" font-size="16" font-weight="600">已登记的 Shell 会话</text>
  <text x="604" y="448" fill="#6b7280" font-size="14">停止时用来终止进程组</text>
  <rect x="1080" y="104" width="480" height="400" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="1100" y="136" fill="#111827" font-size="20" font-weight="700">进程之外</text>
  <text x="1100" y="160" fill="#16a34a" font-size="13">能重新读到，不等于能继续执行</text>
  <rect x="1096" y="184" width="448" height="92" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="进程之外-PostgreSQL"/>
  <rect x="1104" y="196" width="6" height="68" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="1124" y="216" fill="#111827" font-size="16" font-weight="600">PostgreSQL</text>
  <text x="1124" y="240" fill="#6b7280" font-size="14">项目、runs、events、记忆与文件</text>
  <rect x="1096" y="288" width="448" height="92" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="进程之外-Redis"/>
  <rect x="1104" y="300" width="6" height="68" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="1124" y="320" fill="#111827" font-size="16" font-weight="600">Redis</text>
  <text x="1124" y="344" fill="#6b7280" font-size="14">输入流；通知与不落库的增量</text>
  <rect x="1096" y="392" width="448" height="92" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="进程之外-沙箱文件与进程"/>
  <rect x="1104" y="404" width="6" height="68" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="1124" y="424" fill="#111827" font-size="16" font-weight="600">沙箱文件与进程</text>
  <text x="1124" y="448" fill="#6b7280" font-size="14">项目文件、快照与附件在存储里</text>
  <text x="40" y="540" fill="#111827" font-size="18" font-weight="700">进程之外的数据，可恢复性并不相同</text>
  <rect x="40" y="564" width="480" height="168" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="ref"/>
  <rect x="48" y="576" width="6" height="144" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="68" y="596" fill="#ea580c" font-size="20" font-weight="600">引用</text>
  <text x="68" y="620" fill="#6b7280" font-size="13">ID 指向进程外的资源</text>
  <text x="68" y="641" fill="#6b7280" font-size="13">库里有 sandbox_id</text>
  <text x="68" y="662" fill="#6b7280" font-size="13">不代表那个容器还在</text>
  <rect x="560" y="564" width="480" height="168" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="snap"/>
  <rect x="568" y="576" width="6" height="144" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="588" y="596" fill="#16a34a" font-size="20" font-weight="600">快照</text>
  <text x="588" y="620" fill="#6b7280" font-size="13">记录是某一刻的样子</text>
  <text x="588" y="641" fill="#6b7280" font-size="13">events 能按 seq 回放</text>
  <text x="588" y="662" fill="#6b7280" font-size="13">不能从中断处接着执行</text>
  <rect x="1080" y="564" width="480" height="168" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3.5" data-graph-role="node" data-node-id="side"/>
  <rect x="1088" y="576" width="6" height="144" rx="3" fill="#dc2626" data-graph-role="decoration"/>
  <text x="1108" y="596" fill="#dc2626" font-size="20" font-weight="600">真实副作用</text>
  <text x="1108" y="620" fill="#6b7280" font-size="13">沙箱里的文件已经改变</text>
  <text x="1108" y="641" fill="#6b7280" font-size="13">停止和失败都不会回滚</text>
  <text x="1108" y="662" fill="#6b7280" font-size="13">项目终态需确认旧写入者静止</text>
  <path d="M40 784 H1560" fill="none" stroke="#e5e7eb" stroke-width="2" data-graph-role="decoration"/>
  <text x="40" y="812" fill="#6b7280" font-size="14">保存和回放已经做到。从中断处继续执行，还要有检查点与执行所有权；当前没有。等待提问可以续接。</text>
</svg>
