  <text x="1172" y="303" fill="#20312f" font-size="22" font-weight="600" text-anchor="start">会话、记忆与事件历史</text>
  <rect x="1096" y="348" width="416" height="76" rx="10" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
