  </g>
  <text x="668" y="395" fill="#20312f" font-size="22" font-weight="600" text-anchor="start">任务注册表</text>
  <rect x="592" y="440" width="416" height="76" rx="10" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <g transform="translate(614 452) scale(1.3)" fill="none" stroke="#97691f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
