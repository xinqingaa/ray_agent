    <path d="M2 12H6L9 4L14 20L17 12H22" />
  </g>
  <text x="668" y="303" fill="#20312f" font-size="22" font-weight="600" text-anchor="start">执行协程</text>
  <rect x="592" y="348" width="416" height="76" rx="10" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <g transform="translate(614 360) scale(1.3)" fill="none" stroke="#97691f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
