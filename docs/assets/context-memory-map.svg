<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">RayAgent：记忆分层与请求装配</title><desc id="desc">会话工作记忆、冻结项目背景与结构化任务状态进入本次请求；持久事件用于回放和重建，不逐轮全量注入。</desc>
