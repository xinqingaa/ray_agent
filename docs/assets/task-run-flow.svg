<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-quality-profile="showcase">
<title id="title">RayAgent：任务循环与退出路径</title><desc id="desc">运行组织上下文并请求模型。有工具调用时进入工具管线，结果回填上下文；无调用时经过有限结束反馈，保存答复与成果状态。提问和审批保存状态并退出当前协程，答复处理后恢复原上下文与待处理调用。其他运行终止条件独立列出。</desc>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif}</style>
<defs>
<marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M3 2L12 7L3 12" fill="none" stroke="#e68728" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M3 2L12 7L3 12" fill="none" stroke="#5394c6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M3 2L12 7L3 12" fill="none" stroke="#518e73" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M3 2L12 7L3 12" fill="none" stroke="#9980b5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M3 2L12 7L3 12" fill="none" stroke="#c66968" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="900" fill="#fffefb" data-graph-role="background"/>
<path d="M65 66Q440 48 1190 62L1177 79L1202 94Q540 115 69 109L79 91Z" fill="#fff0ce" data-graph-role="decoration"/>
<text x="80" y="104" font-size="46" font-weight="700" fill="#17263c" text-anchor="start" data-graph-role="label">RayAgent：任务循环与退出路径</text>
<text x="80" y="159" font-size="25" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">模型读取工具反馈持续决策，等待后沿原运行续接</text>
<rect id="context" x="70" y="320" width="300" height="130" rx="24" fill="#fff5df" stroke="#d9b779" stroke-width="2.5" data-graph-role="node"/>
<g transform="translate(92 341) scale(.64)" stroke="#31465d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration" data-owner="context"><rect xmlns="http://www.w3.org/2000/svg" x="8" y="13" width="42" height="54" rx="5" fill="#dceefa" transform="rotate(-9 29 40)" /><path xmlns="http://www.w3.org/2000/svg" d="M22 3H56L70 18V65Q70 70 65 70H22Q17 70 17 65V8Q17 3 22 3Z" fill="#fff" /><path xmlns="http://www.w3.org/2000/svg" d="M56 3V18H70" fill="#ffdc92" /><path xmlns="http://www.w3.org/2000/svg" d="M29 30H58M29 42H58M29 54H48" stroke="#5d8bb5" /></g>
<text x="152" y="368" font-size="29" font-weight="600" fill="#17263c" text-anchor="start" data-graph-role="decoration" data-owner="context">组织上下文</text>
<text x="94" y="426" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="context">纳入消息 · 检查容量</text>
<rect id="model" x="480" y="320" width="300" height="130" rx="24" fill="#eff6fc" stroke="#94b5ce" stroke-width="2.5" data-graph-role="node"/>
<g transform="translate(502 341) scale(.64)" stroke="#31465d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration" data-owner="model"><path xmlns="http://www.w3.org/2000/svg" d="M31 12V4" fill="none" /><circle xmlns="http://www.w3.org/2000/svg" cx="31" cy="3" r="3" fill="#ffdc92" /><rect xmlns="http://www.w3.org/2000/svg" x="6" y="12" width="50" height="43" rx="15" fill="#fff" /><rect xmlns="http://www.w3.org/2000/svg" x="15" y="24" width="32" height="19" rx="7" fill="#263e59" /><path xmlns="http://www.w3.org/2000/svg" d="M21 33H24M38 33H41" stroke="#fff" /><path xmlns="http://www.w3.org/2000/svg" d="M23 55L18 62M40 55L45 62" fill="none" /></g>
<text x="562" y="368" font-size="29" font-weight="600" fill="#17263c" text-anchor="start" data-graph-role="decoration" data-owner="model">请求模型</text>
<text x="504" y="426" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="model">解析文本与工具调用</text>
<rect id="tools" x="890" y="320" width="300" height="130" rx="24" fill="#eff6fc" stroke="#94b5ce" stroke-width="2.5" data-graph-role="node"/>
<g transform="translate(912 341) scale(.64)" stroke="#31465d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration" data-owner="tools"><rect xmlns="http://www.w3.org/2000/svg" x="3" y="9" width="69" height="55" rx="8" fill="#fff" /><path xmlns="http://www.w3.org/2000/svg" d="M3 24H72" stroke="#5c8ebd" /><circle xmlns="http://www.w3.org/2000/svg" cx="12" cy="17" r="2" fill="#5c8ebd" stroke="none" /><circle xmlns="http://www.w3.org/2000/svg" cx="21" cy="17" r="2" fill="#5c8ebd" stroke="none" /><path xmlns="http://www.w3.org/2000/svg" d="M16 36L25 44L16 52M36 52H52" stroke="#3f7eae" /></g>
<text x="972" y="368" font-size="29" font-weight="600" fill="#17263c" text-anchor="start" data-graph-role="decoration" data-owner="tools">工具管线</text>
<text x="914" y="426" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="tools">校验授权 · 执行整形</text>
<path id="context-model" data-graph-role="edge" data-source="context" data-target="model" d="M370 385H480" fill="none" stroke="#e68728" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path id="model-tools" data-graph-role="edge" data-source="model" data-target="tools" d="M780 385H890" fill="none" stroke="#e68728" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="791" y="367" font-size="22" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="model-tools">有调用</text>
<path id="feedback" data-graph-role="edge" data-source="tools" data-target="context" d="M1040 320V245H220V320" fill="none" stroke="#5394c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="470" y="228" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="feedback">工具结果进入下一轮上下文</text>
<rect id="complete" x="480" y="620" width="300" height="120" rx="24" fill="#eef7f0" stroke="#9dbfa9" stroke-width="2.5" data-graph-role="node"/>
<g transform="translate(502 641) scale(.64)" stroke="#31465d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration" data-owner="complete"><path xmlns="http://www.w3.org/2000/svg" d="M9 4H45L59 18V67H9Z" fill="#fff" /><path xmlns="http://www.w3.org/2000/svg" d="M45 4V18H59" fill="#def2e6" /><path xmlns="http://www.w3.org/2000/svg" d="M22 31H43M22 42H38" stroke="#81a591" /><circle xmlns="http://www.w3.org/2000/svg" cx="56" cy="57" r="18" fill="#d6efdf" /><path xmlns="http://www.w3.org/2000/svg" d="M46 57L53 64L66 49" stroke="#338367" stroke-width="5" /></g>
<text x="562" y="668" font-size="29" font-weight="600" fill="#17263c" text-anchor="start" data-graph-role="decoration" data-owner="complete">完成</text>
<text x="504" y="716" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="complete">保存答复与成果状态</text>
<path id="model-complete" data-graph-role="edge" data-source="model" data-target="complete" d="M630 450V620" fill="none" stroke="#e68728" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="650" y="539" font-size="22" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="model-complete">无调用 · 结束反馈</text>
<rect id="waiting" x="890" y="620" width="640" height="120" rx="24" fill="#f5f1f9" stroke="#b6a5c7" stroke-width="2.5" data-graph-role="node"/>
<g transform="translate(912 641) scale(.64)" stroke="#31465d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration" data-owner="waiting"><rect xmlns="http://www.w3.org/2000/svg" x="8" y="6" width="46" height="51" rx="12" fill="#fff" /><path xmlns="http://www.w3.org/2000/svg" d="M25 20V43M38 20V43" fill="none" stroke="#9980b5" /></g>
<text x="972" y="668" font-size="29" font-weight="600" fill="#17263c" text-anchor="start" data-graph-role="decoration" data-owner="waiting">等待与续接</text>
<text x="914" y="716" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="waiting">提问 / 审批 · 保存状态，退出当前协程</text>
<path id="tools-wait" data-graph-role="edge" data-source="tools" data-target="waiting" d="M980 450V620" fill="none" stroke="#9980b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text x="850" y="565" font-size="22" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="tools-wait">提问 / 审批</text>
<path id="wait-resume" data-graph-role="edge" data-source="waiting" data-target="tools" d="M1110 620V450" fill="none" stroke="#9980b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text x="1130" y="565" font-size="22" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="wait-resume">答复处理后续接</text>
<text x="80" y="660" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">等待续接恢复原上下文</text>
<text x="80" y="701" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">与尚待处理的工具调用</text>
<text x="1290" y="357" font-size="24" font-weight="600" fill="#31465d" text-anchor="start" data-graph-role="label">正常结束与</text>
<text x="1290" y="396" font-size="24" font-weight="600" fill="#31465d" text-anchor="start" data-graph-role="label">成果完整分别记录</text>
<rect id="termination" x="55" y="775" width="1490" height="65" rx="24" fill="#fcf1f0" fill-opacity=".32" stroke="#d5aaa7" stroke-width="1.6" stroke-dasharray="9 8" data-graph-role="container"/>
<text x="79" y="810" font-size="24" font-weight="600" fill="#31465d" text-anchor="start" data-graph-role="decoration" data-owner="termination">其他终态</text>
<text x="300" y="815" font-size="24" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="termination">运行错误 → 失败</text>
<text x="700" y="815" font-size="24" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="termination">用户停止 → 停止</text>
<text x="1100" y="815" font-size="24" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="termination">重启 / 失联 → 中断</text>
