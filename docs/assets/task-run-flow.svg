<path d="M74 872H108" stroke="#e68728" stroke-width="3" stroke-linecap="round" data-graph-role="legend"/>
<text x="120" y="880" font-size="21" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">决策路径</text>
<path d="M294 872H328" stroke="#5394c6" stroke-width="3" stroke-linecap="round" data-graph-role="legend"/>
<text x="340" y="880" font-size="21" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">工具反馈</text>
<path d="M514 872H548" stroke="#9980b5" stroke-width="3" stroke-linecap="round" data-graph-role="legend"/>
<text x="560" y="880" font-size="21" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">等待与续接</text>
</svg>
