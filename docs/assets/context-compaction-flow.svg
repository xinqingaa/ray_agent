<text x="80" y="104" font-size="46" font-weight="700" fill="#17263c" text-anchor="start" data-graph-role="label">RayAgent：上下文压缩与信息保留</text>
<text x="80" y="159" font-size="25" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">检查容量，按需整理历史，再复查能否继续</text>
