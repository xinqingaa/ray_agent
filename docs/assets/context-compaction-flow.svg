<text x="1285" y="552" font-size="28" text-anchor="start" font-weight="700" class="">重组工作记忆</text>
<text x="1365.0" y="590" font-size="23" text-anchor="middle" font-weight="400" class="sub">摘要 · 原文 · 近期轮次</text>
<text x="1365" y="628" font-size="22" text-anchor="middle" font-weight="400" class="sub">补回最新任务状态</text>
