<text x="1324" y="436" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="continue">容量可用才继续</text>
<path id="capacity-compact" data-graph-role="edge" data-source="capacity" data-target="compact" d="M350 395H450" fill="none" stroke="#e68728" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="360" y="377" font-size="22" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="capacity-compact">需要</text>
<path id="compact-recheck" data-graph-role="edge" data-source="compact" data-target="recheck" d="M800 395H900" fill="none" stroke="#e68728" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="820" y="377" font-size="22" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="compact-recheck">成功</text>
<path id="recheck-continue" data-graph-role="edge" data-source="recheck" data-target="continue" d="M1200 395H1300" fill="none" stroke="#e68728" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="1220" y="377" font-size="22" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="recheck-continue">可用</text>
<path id="skip-summary" data-graph-role="edge" data-source="capacity" data-target="recheck" d="M205 330V245H1050V330" fill="none" stroke="#5394c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="440" y="228" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label" data-owner="skip-summary">无需摘要 / 收益不足时跳过</text>
<text x="80" y="555" font-size="25" font-weight="600" fill="#31465d" text-anchor="start" data-graph-role="label">独立摘要请求</text>
<text x="80" y="598" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">不带业务工具</text>
<text x="80" y="640" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">只替换工作记忆</text>
