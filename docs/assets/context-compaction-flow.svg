<rect id="recheck" x="900" y="330" width="300" height="130" rx="24" fill="#eff6fc" stroke="#94b5ce" stroke-width="2.5" data-graph-role="node"/>
<g transform="translate(922 351) scale(.64)" stroke="#31465d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration" data-owner="recheck"><rect xmlns="http://www.w3.org/2000/svg" x="8" y="13" width="42" height="54" rx="5" fill="#dceefa" transform="rotate(-9 29 40)" /><path xmlns="http://www.w3.org/2000/svg" d="M22 3H56L70 18V65Q70 70 65 70H22Q17 70 17 65V8Q17 3 22 3Z" fill="#fff" /><path xmlns="http://www.w3.org/2000/svg" d="M56 3V18H70" fill="#ffdc92" /><path xmlns="http://www.w3.org/2000/svg" d="M29 30H58M29 42H58M29 54H48" stroke="#5d8bb5" /></g>
