<text x="924" y="436" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="recheck">按新消息重新估算</text>
<rect id="continue" x="1300" y="330" width="240" height="130" rx="24" fill="#eef7f0" stroke="#9dbfa9" stroke-width="2.5" data-graph-role="node"/>
