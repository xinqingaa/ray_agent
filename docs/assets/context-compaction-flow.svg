<text x="474" y="555" font-size="24" font-weight="600" fill="#31465d" text-anchor="start" data-graph-role="decoration" data-owner="preservation">重组时保留与恢复</text>
<text x="478" y="601" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="preservation">摘要 · 用户原文 · 近期完整轮次</text>
<text x="478" y="640" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="preservation">最新计划、范围、成果与核验状态</text>
<text x="1060" y="601" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="preservation">活动 skill 目录与正文</text>
<text x="1060" y="640" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="preservation">持久历史保留，供回看与重建</text>
