<text x="855" y="297" font-size="28" text-anchor="start" font-weight="700" class="">选择完整轮次</text>
<text x="930.0" y="345" font-size="23" text-anchor="middle" font-weight="400" class="sub">保留近期，摘要较早历史</text>
