<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">任务运行模型</title>
  <desc id="desc">单循环在请求前检查容量，工具按批次校验并执行一次，提问或审批则等待后续接。</desc>
  <style>text { font-family: 'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Songti SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif; }</style>
  <defs>
    <marker id="arr-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#2563eb"/></marker><marker id="arr-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#16a34a"/></marker><marker id="arr-ea580c" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#ea580c"/></marker><marker id="arr-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#dc2626"/></marker><marker id="arr-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#7c3aed"/></marker><marker id="arr-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#475569"/></marker><marker id="arr-6b7280" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff" data-graph-role="background"/>
  <text x="40" y="36" fill="#16a34a" font-size="14" font-weight="600">RAYAGENT ／ 任务运行模型</text>
  <text x="40" y="70" fill="#111827" font-size="28" font-weight="700">一次运行如何在单循环里推进</text>
  <rect x="36" y="118" width="228" height="108" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="accept"/>
  <rect x="44" y="130" width="6" height="84" rx="3" fill="#475569" data-graph-role="decoration"/>
  <text x="64" y="150" fill="#111827" font-size="16" font-weight="600">受理运行</text>
  <text x="64" y="174" fill="#6b7280" font-size="14">创建、注入或续接</text>
  <text x="64" y="196" fill="#6b7280" font-size="14">审批答复另走入口</text>
  <rect x="304" y="118" width="268" height="108" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="check"/>
  <rect x="312" y="130" width="6" height="84" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="332" y="150" fill="#111827" font-size="16" font-weight="600">请求前</text>
  <text x="332" y="174" fill="#6b7280" font-size="14">先纳入补充消息</text>
  <text x="332" y="196" fill="#6b7280" font-size="14">超水位则先压缩</text>
  <rect x="612" y="118" width="248" height="108" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="model"/>
  <rect x="620" y="130" width="6" height="84" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="640" y="150" fill="#111827" font-size="16" font-weight="600">请求模型</text>
  <text x="640" y="174" fill="#6b7280" font-size="14">流式组装完整结果</text>
  <text x="640" y="196" fill="#6b7280" font-size="14">工具等组装完再执行</text>
  <rect x="900" y="118" width="176" height="108" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="decide"/>
  <text x="916" y="178.0" fill="#ea580c" font-size="16" font-weight="600">有工具调用？</text>
  <rect x="1116" y="118" width="400" height="108" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="done"/>
  <rect x="1124" y="130" width="6" height="84" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="1144" y="150" fill="#111827" font-size="16" font-weight="600">结束检查与最终答复</text>
  <text x="1144" y="174" fill="#6b7280" font-size="14">交付与未完成计划：最多反馈一次</text>
  <text x="1144" y="196" fill="#6b7280" font-size="14">仍有问题则说明，再 completed</text>
  <rect x="304" y="286" width="792" height="176" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="320" y="308" fill="#16a34a" font-size="13" font-weight="600">结果按原顺序；独立读取最多并发三项</text>
  <rect x="320" y="322" width="210" height="120" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="before"/>
  <rect x="328" y="334" width="6" height="96" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="348" y="354" fill="#111827" font-size="16" font-weight="600">执行前</text>
  <text x="348" y="378" fill="#6b7280" font-size="14">校验参数</text>
  <text x="348" y="400" fill="#6b7280" font-size="14">allow / ask / deny</text>
  <text x="348" y="422" fill="#6b7280" font-size="14">deny 直接回填</text>
  <rect x="590" y="322" width="200" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="once"/>
  <rect x="598" y="334" width="6" height="96" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="618" y="354" fill="#111827" font-size="16" font-weight="600">执行一次</text>
  <text x="618" y="378" fill="#6b7280" font-size="14">读取有界并发，其他串行</text>
  <text x="618" y="400" fill="#6b7280" font-size="14">失败回填；调用不重试</text>
  <rect x="850" y="322" width="220" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="after"/>
  <rect x="858" y="334" width="6" height="96" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="878" y="354" fill="#111827" font-size="16" font-weight="600">执行后</text>
  <text x="878" y="378" fill="#6b7280" font-size="14">超长则整形落盘</text>
  <text x="878" y="400" fill="#6b7280" font-size="14">按调用 ID 回填</text>
  <rect x="36" y="512" width="360" height="148" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3.5" data-graph-role="node" data-node-id="compact"/>
  <rect x="44" y="524" width="6" height="124" rx="3" fill="#7c3aed" data-graph-role="decoration"/>
  <text x="64" y="544" fill="#111827" font-size="16" font-weight="600">自动压缩</text>
  <text x="64" y="568" fill="#6b7280" font-size="14">超水位，或服务端以超长拒绝</text>
  <text x="64" y="590" fill="#6b7280" font-size="14">保留近几轮，并重注用户原文</text>
  <text x="64" y="612" fill="#6b7280" font-size="14">失败或仍放不下 → context_limit</text>
  <rect x="420" y="512" width="400" height="148" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="reply"/>
  <rect x="428" y="524" width="6" height="124" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="448" y="544" fill="#111827" font-size="16" font-weight="600">等待回复 · waiting</text>
  <text x="448" y="568" fill="#6b7280" font-size="14">提问后退出当前协程</text>
  <text x="448" y="590" fill="#6b7280" font-size="14">回复后续接同一个运行</text>
  <text x="448" y="612" fill="#6b7280" font-size="14">本批排在后面的调用不执行</text>
  <rect x="844" y="512" width="440" height="148" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="approval"/>
  <rect x="852" y="524" width="6" height="124" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="872" y="544" fill="#111827" font-size="16" font-weight="600">等待审批 · approval</text>
  <text x="872" y="568" fill="#6b7280" font-size="14">策略为 ask 时先挂起</text>
  <text x="872" y="590" fill="#6b7280" font-size="14">批准后再执行，拒绝则不执行</text>
  <text x="872" y="612" fill="#6b7280" font-size="14">计划与提问不走这道闸门</text>
  <path d="M 264.0 172.0 L 304.0 172.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <path d="M 572.0 172.0 L 612.0 172.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <path d="M 860.0 172.0 L 900.0 172.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <path d="M 1076.0 172.0 L 1116.0 172.0" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-16a34a)" data-graph-role="edge"/>
  <rect x="1081" y="150" width="19.0" height="17" rx="2" fill="#ffffff" data-graph-role="decoration"/>
  <text x="1084" y="162" fill="#16a34a" font-size="13" font-weight="600" data-graph-role="label">无</text>
  <path d="M 988.0 226.0 L 988.0 258.0 L 500.0 258.0 L 500.0 322.0" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-ea580c)" data-graph-role="edge"/>
  <rect x="1001" y="236" width="19.0" height="17" rx="2" fill="#ffffff" data-graph-role="decoration"/>
  <text x="1004" y="248" fill="#ea580c" font-size="13" font-weight="600" data-graph-role="label">有</text>
  <path d="M 530.0 382.0 L 590.0 382.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <rect x="539" y="356" width="42.400000000000006" height="17" rx="2" fill="#ffffff" data-graph-role="decoration"/>
  <text x="542" y="368" fill="#2563eb" font-size="13" font-weight="600" data-graph-role="label">allow</text>
  <path d="M 790.0 382.0 L 850.0 382.0" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-16a34a)" data-graph-role="edge"/>
  <path d="M 1070.0 382.0 L 1560.0 382.0 L 1560.0 96.0 L 438.0 96.0 L 438.0 118.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <rect x="1185" y="72" width="84.0" height="17" rx="2" fill="#ffffff" data-graph-role="decoration"/>
  <text x="1188" y="84" fill="#2563eb" font-size="13" font-weight="600" data-graph-role="label">回填后再请求</text>
  <path d="M 304.0 190.0 L 276.0 190.0 L 276.0 512.0" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-7c3aed)" data-graph-role="edge"/>
  <rect x="165" y="336" width="45.0" height="17" rx="2" fill="#ffffff" data-graph-role="decoration"/>
  <text x="168" y="348" fill="#7c3aed" font-size="13" font-weight="600" data-graph-role="label">超水位</text>
  <path d="M 425.0 442.0 L 425.0 512.0" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-ea580c)" data-graph-role="edge"/>
  <rect x="435" y="466" width="32.0" height="17" rx="2" fill="#ffffff" data-graph-role="decoration"/>
  <text x="438" y="478" fill="#ea580c" font-size="13" font-weight="600" data-graph-role="label">提问</text>
  <path d="M 500.0 442.0 L 500.0 486.0 L 1064.0 486.0 L 1064.0 512.0" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-ea580c)" data-graph-role="edge"/>
  <rect x="757" y="462" width="27.840000000000003" height="17" rx="2" fill="#ffffff" data-graph-role="decoration"/>
  <text x="760" y="474" fill="#ea580c" font-size="13" font-weight="600" data-graph-role="label">ask</text>
  <rect x="36" y="688" width="1528" height="78" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="52" y="718" fill="#111827" font-size="15" font-weight="700">离开 running</text>
  <text x="200" y="718" fill="#16a34a" font-size="14" font-weight="600">完成 completed</text>
  <text x="430" y="718" fill="#ea580c" font-size="14" font-weight="600">等待 reply / approval</text>
  <text x="720" y="718" fill="#dc2626" font-size="14" font-weight="600">失败</text>
  <text x="860" y="718" fill="#475569" font-size="14" font-weight="600">停止 user_stop</text>
  <text x="1100" y="718" fill="#7c3aed" font-size="14" font-weight="600">中断 api_restart</text>
  <text x="52" y="746" fill="#6b7280" font-size="13">失败含请求上限、输出截断、模型错误、上下文与运行器异常。停止和重启可以在任意时刻打断。原因与收尾见结束路径。</text>
  <path d="M40 800 H1560" fill="none" stroke="#e5e7eb" stroke-width="2" data-graph-role="decoration"/>
  <text x="40" y="828" fill="#6b7280" font-size="14">蓝：主循环    琥珀：等待与策略    紫：压缩    绿：结束与回填。有限结束反馈不构成业务目标验收。</text>
</svg>
