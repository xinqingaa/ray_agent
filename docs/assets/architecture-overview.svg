  <rect x="0" y="0" width="1600" height="1400" rx="0" fill="#fafcfb" stroke="none" stroke-width="2" data-graph-role="background" />
  <text x="64" y="63" fill="#177b65" font-size="22" font-weight="600" text-anchor="start">RAYAGENT  /  系统组成</text>
  <text x="64" y="139" fill="#20312f" font-size="51" font-weight="650" text-anchor="start">系统架构</text>
  <text x="64" y="187" fill="#536965" font-size="25" font-weight="400" text-anchor="start">任务运行位于应用内部；模型、执行环境与存储各自承担明确职责。</text>
  <rect x="500" y="245" width="600" height="110" rx="10" fill="white" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" id="ui" />
  <g transform="translate(523 266) scale(1.4)" fill="none" stroke="#20312f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
