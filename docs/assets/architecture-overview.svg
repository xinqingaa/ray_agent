<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RayAgent 系统架构</title>
  <desc id="desc">组件边界、控制流与数据归属：事件先落库，Redis 只通知，沙箱画面不经工具层。</desc>
  <style>text { font-family: 'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Songti SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif; }</style>
  <defs>
    <marker id="arr-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#2563eb"/></marker><marker id="arr-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#16a34a"/></marker><marker id="arr-ea580c" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#ea580c"/></marker><marker id="arr-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#dc2626"/></marker><marker id="arr-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#7c3aed"/></marker><marker id="arr-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#475569"/></marker><marker id="arr-6b7280" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff" data-graph-role="background"/>
  <text x="40" y="36" fill="#16a34a" font-size="14" font-weight="600">RAYAGENT ／ 系统组成</text>
  <text x="40" y="70" fill="#111827" font-size="28" font-weight="700">组件边界、控制流与数据归属</text>
  <rect x="500" y="96" width="600" height="72" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="web"/>
  <rect x="508" y="108" width="6" height="48" rx="3" fill="#475569" data-graph-role="decoration"/>
  <text x="528" y="128" fill="#111827" font-size="16" font-weight="600">Web 会话</text>
  <text x="528" y="152" fill="#6b7280" font-size="14">计划、时间线、工作台与沙箱画面</text>
  <rect x="488" y="196" width="624" height="548" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="504" y="218" fill="#16a34a" font-size="13" font-weight="600">API</text>
  <rect x="28" y="228" width="420" height="516" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="7 6" data-graph-role="container"/>
  <text x="44" y="250" fill="#16a34a" font-size="13" font-weight="600">状态与存储</text>
  <rect x="508" y="248" width="584" height="108" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="coord"/>
  <rect x="516" y="260" width="6" height="84" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="536" y="280" fill="#111827" font-size="16" font-weight="600">会话与应用协调</text>
  <text x="536" y="304" fill="#6b7280" font-size="13">接收消息与停止</text>
  <text x="536" y="325" fill="#6b7280" font-size="13">准备沙箱，启动或续接运行</text>
  <rect x="508" y="396" width="584" height="128" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="loop"/>
  <rect x="516" y="408" width="6" height="104" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="536" y="428" fill="#111827" font-size="16" font-weight="600">单循环任务运行</text>
  <text x="536" y="452" fill="#6b7280" font-size="13">容量检查、压缩与工具批次</text>
  <text x="536" y="473" fill="#6b7280" font-size="13">事件写入运行账本后再通知</text>
  <rect x="508" y="564" width="584" height="132" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="adapt"/>
  <rect x="516" y="576" width="6" height="108" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="536" y="596" fill="#111827" font-size="16" font-weight="600">工具适配</text>
  <text x="536" y="620" fill="#6b7280" font-size="14">校验，再按 allow / ask / deny</text>
  <text x="536" y="642" fill="#6b7280" font-size="14">执行一次，超长结果整形落盘</text>
  <text x="536" y="664" fill="#6b7280" font-size="14">文件、Shell、浏览器、MCP、A2A</text>
  <rect x="48" y="260" width="380" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="redis"/>
  <rect x="56" y="272" width="6" height="96" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="76" y="292" fill="#111827" font-size="16" font-weight="600">Redis</text>
  <text x="76" y="316" fill="#6b7280" font-size="14">输入流，由协调写入</text>
  <text x="76" y="338" fill="#6b7280" font-size="14">运行发布通知与文本增量</text>
  <text x="76" y="360" fill="#6b7280" font-size="14">增量不落库，丢失不补发</text>
  <rect x="48" y="408" width="380" height="128" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="pg"/>
  <rect x="56" y="420" width="6" height="104" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="76" y="440" fill="#111827" font-size="16" font-weight="600">PostgreSQL</text>
  <text x="76" y="464" fill="#6b7280" font-size="14">会话、记忆、文件元数据</text>
  <text x="76" y="486" fill="#6b7280" font-size="14">runs 与 events 是事实源</text>
  <text x="76" y="508" fill="#6b7280" font-size="14">先落库，再发通知</text>
  <rect x="48" y="564" width="380" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="files"/>
  <rect x="56" y="576" width="6" height="96" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="76" y="596" fill="#111827" font-size="16" font-weight="600">文件存储</text>
  <text x="76" y="620" fill="#6b7280" font-size="13">附件、执行文件与截图</text>
  <text x="76" y="641" fill="#6b7280" font-size="13">和数据库不是同一个事务</text>
  <rect x="1188" y="248" width="332" height="108" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3.5" data-graph-role="node" data-node-id="ext"/>
  <rect x="1196" y="260" width="6" height="84" rx="3" fill="#dc2626" data-graph-role="decoration"/>
  <text x="1216" y="280" fill="#111827" font-size="16" font-weight="600">外部服务</text>
  <text x="1216" y="304" fill="#6b7280" font-size="13">搜索、MCP 与 A2A</text>
  <text x="1216" y="325" fill="#6b7280" font-size="13">多轮交互按失败返回</text>
  <rect x="1188" y="396" width="332" height="128" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="model"/>
  <rect x="1196" y="408" width="6" height="104" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="1216" y="428" fill="#111827" font-size="16" font-weight="600">模型服务</text>
  <text x="1216" y="452" fill="#6b7280" font-size="13">流式组装完整结果</text>
  <text x="1216" y="473" fill="#6b7280" font-size="13">工具调用等组装完再执行</text>
  <rect x="1188" y="564" width="332" height="132" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3.5" data-graph-role="node" data-node-id="sandbox"/>
  <rect x="1196" y="576" width="6" height="108" rx="3" fill="#7c3aed" data-graph-role="decoration"/>
  <text x="1216" y="596" fill="#111827" font-size="16" font-weight="600">沙箱</text>
  <text x="1216" y="620" fill="#6b7280" font-size="14">文件、Shell 与进程</text>
  <text x="1216" y="642" fill="#6b7280" font-size="14">ubuntu 执行</text>
  <text x="1216" y="664" fill="#6b7280" font-size="14">2048 MiB · 2 CPU · 512 进程</text>
