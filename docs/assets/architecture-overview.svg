  </g>
  <text x="586" y="817" fill="#20312f" font-size="28" font-weight="600" text-anchor="start">任务运行</text>
  <text x="534" y="856" fill="#536965" font-size="23" font-weight="400" text-anchor="start">Plan + ReAct · 模型调用 · 工具调度</text>
  <text x="534" y="888" fill="#536965" font-size="23" font-weight="400" text-anchor="start">上下文与记忆 · 事件发布 · 文件同步</text>
  <rect x="510" y="1040" width="580" height="110" rx="10" fill="white" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" id="adapters" />
