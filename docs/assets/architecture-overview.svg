  <text x="504" y="396" fill="#3268bf" font-size="23" font-weight="600" text-anchor="start">网关 · HTTP</text>
  <path id="sse" data-graph-role="edge" data-source="app" data-target="ui" d="M950 500 L950 355" fill="none" stroke="#177b65" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#177b65)" />
  <text x="976" y="396" fill="#177b65" font-size="23" font-weight="600" text-anchor="start">SSE 事件</text>
  <path id="io" data-graph-role="edge" data-source="app" data-target="redis" d="M510 556 L354 556" fill="none" stroke="#3268bf" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#3268bf)" marker-start="url(#3268bf)" />
  <text x="376" y="539" fill="#536965" font-size="21" font-weight="400" text-anchor="start">消息读写</text>
  <path id="schedule" data-graph-role="edge" data-source="app" data-target="runtime" d="M800 612 L800 770" fill="none" stroke="#3268bf" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#3268bf)" />
  <text x="824" y="704" fill="#3268bf" font-size="23" font-weight="600" text-anchor="start">启动 / 控制</text>
  <path id="event" data-graph-role="edge" data-source="runtime" data-target="redis" d="M510 800 L411 800 L411 596 L354 596" fill="none" stroke="#3268bf" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#3268bf)" marker-start="url(#3268bf)" />
  <text x="421" y="728" fill="#536965" font-size="21" font-weight="400" text-anchor="start">事件</text>
  <path id="persist" data-graph-role="edge" data-source="runtime" data-target="db" d="M510 868 L354 868" fill="none" stroke="#177b65" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#177b65)" marker-start="url(#177b65)" />
  <text x="376" y="849" fill="#177b65" font-size="21" font-weight="400" text-anchor="start">保存 / 加载</text>
  <path id="sync" data-graph-role="edge" data-source="runtime" data-target="files" d="M510 898 L435 898 L435 1096 L354 1096" fill="none" stroke="#177b65" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#177b65)" marker-start="url(#177b65)" />
  <text x="369" y="999" fill="#177b65" font-size="21" font-weight="400" text-anchor="start">同步</text>
  <path id="llm" data-graph-role="edge" data-source="runtime" data-target="model" d="M1090 805 L1175 805 L1175 556 L1246 556" fill="none" stroke="#3268bf" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#3268bf)" marker-start="url(#3268bf)" />
  <text x="1194" y="705" fill="#536965" font-size="21" font-weight="400" text-anchor="start">模型调用</text>
  <path id="dispatch" data-graph-role="edge" data-source="runtime" data-target="adapters" d="M800 915 L800 1040" fill="none" stroke="#3268bf" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#3268bf)" marker-start="url(#3268bf)" />
  <text x="824" y="994" fill="#3268bf" font-size="23" font-weight="600" text-anchor="start">动作 / 结果</text>
  <path id="exec" data-graph-role="edge" data-source="adapters" data-target="sandbox" d="M1090 1075 L1210 1075 L1210 868 L1246 868" fill="none" stroke="#70579c" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#70579c)" marker-start="url(#70579c)" />
  <text x="1280" y="982" fill="#70579c" font-size="21" font-weight="400" text-anchor="start">HTTP / CDP</text>
  <path id="protocol" data-graph-role="edge" data-source="adapters" data-target="remote" d="M1090 1125 L1246 1125" fill="none" stroke="#bd5254" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#bd5254)" marker-start="url(#bd5254)" />
  <text x="1103" y="1157" fill="#bd5254" font-size="21" font-weight="400" text-anchor="start">协议调用</text>
  <path d="M64 1242 L1536 1242" fill="none" stroke="#c6d5d0" stroke-width="2" data-graph-role="decoration" />
  <text x="64" y="1290" fill="#536965" font-size="23" font-weight="400" text-anchor="start">蓝：请求与运行消息     绿：持久化与事件回传     紫：沙箱操作     红：外部协议</text>
  <text x="64" y="1332" fill="#536965" font-size="23" font-weight="400" text-anchor="start">沙箱画面经网关转发至 UI；图中双向关系表示请求与结果，不表示跨组件事务。</text>
</svg>