  <text x="88" y="586" fill="#536965" font-size="23" font-weight="400" text-anchor="start">输入消息与输出事件</text>
  <rect x="64" y="785" width="290" height="145" rx="10" fill="white" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" id="db" />
  <g transform="translate(87 806) scale(1.4)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
