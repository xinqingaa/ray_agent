    <path d="M3 12C3 18 21 18 21 12" />
  </g>
  <text x="140" y="832" fill="#20312f" font-size="25" font-weight="600" text-anchor="start">PostgreSQL</text>
  <text x="88" y="871" fill="#536965" font-size="23" font-weight="400" text-anchor="start">会话、历史与记忆</text>
  <text x="88" y="903" fill="#536965" font-size="23" font-weight="400" text-anchor="start">文件元数据</text>
  <rect x="64" y="1040" width="290" height="112" rx="10" fill="white" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" id="files" />
  <g transform="translate(87 1061) scale(1.4)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
