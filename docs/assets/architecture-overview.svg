  <text x="88" y="1126" fill="#536965" font-size="23" font-weight="400" text-anchor="start">本地磁盘 / 对象存储</text>
  <rect x="1246" y="500" width="290" height="112" rx="10" fill="white" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" id="model" />
