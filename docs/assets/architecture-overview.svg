    <path d="M5 6.5H6" />
    <path d="M9 6.5H10" />
  </g>
  <text x="576" y="292" fill="#20312f" font-size="28" font-weight="600" text-anchor="start">Web 会话</text>
  <text x="524" y="331" fill="#536965" font-size="23" font-weight="400" text-anchor="start">计划与消息 · 工具记录 · 文件预览 · 沙箱画面</text>
  <rect x="470" y="425" width="660" height="755" rx="10" fill="#eef5f1" stroke="#a5c3b5" stroke-width="2" data-graph-role="container" />
  <text x="500" y="468" fill="#177b65" font-size="24" font-weight="600" text-anchor="start">API 应用</text>
  <rect x="510" y="500" width="580" height="112" rx="10" fill="white" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" id="app" />
  <g transform="translate(533 521) scale(1.4)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
    <path d="M16 6A4 4 0 1 1 8 6A4 4 0 1 1 16 6" />
    <path d="M3 22V19Q3 13 12 13Q21 13 21 19V22" />
  </g>
  <text x="586" y="547" fill="#20312f" font-size="28" font-weight="600" text-anchor="start">会话与应用协调</text>
