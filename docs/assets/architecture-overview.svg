    <path d="M1 17H7V22H1Z" />
    <path d="M17 17H23V22H17Z" />
  </g>
  <text x="1322" y="1087" fill="#20312f" font-size="28" font-weight="600" text-anchor="start">外部服务</text>
  <text x="1270" y="1126" fill="#536965" font-size="23" font-weight="400" text-anchor="start">搜索 / MCP / A2A</text>
