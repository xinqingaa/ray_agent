  <text x="1322" y="832" fill="#20312f" font-size="28" font-weight="600" text-anchor="start">沙箱环境</text>
  <text x="1270" y="871" fill="#536965" font-size="23" font-weight="400" text-anchor="start">文件、终端与进程</text>
  <text x="1270" y="903" fill="#536965" font-size="23" font-weight="400" text-anchor="start">浏览器 CDP / VNC</text>
  <rect x="1246" y="1040" width="290" height="112" rx="10" fill="white" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" id="remote" />
