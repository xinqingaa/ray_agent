  <text x="1120" y="530" fill="#dc2626" font-size="13" font-weight="600" data-graph-role="label">MCP / A2A</text>
  <path d="M 1520.0 630.0 L 1584.0 630.0 L 1584.0 132.0 L 1100.0 132.0" fill="none" stroke="#6b7280" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arr-6b7280)" marker-start="url(#arr-6b7280)" data-graph-role="edge"/>
  <rect x="1157" y="110" width="136.0" height="17" rx="2" fill="#ffffff" data-graph-role="decoration"/>
  <text x="1160" y="122" fill="#6b7280" font-size="13" font-weight="600" data-graph-role="label">沙箱画面，不经工具层</text>
  <path d="M40 784 H1560" fill="none" stroke="#e5e7eb" stroke-width="2" data-graph-role="decoration"/>
  <text x="40" y="812" fill="#6b7280" font-size="14">蓝：请求与调度    绿：持久化与事件回传    紫：沙箱操作    红：外部协议    灰虚线：画面转发</text>
  <text x="40" y="836" fill="#6b7280" font-size="14">箭头指向被调用方。存储写入不在同一个事务里；事件先落库，Redis 通知只带序号。</text>
