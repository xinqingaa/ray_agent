  </g>
  <text x="1322" y="547" fill="#20312f" font-size="28" font-weight="600" text-anchor="start">模型服务</text>
  <text x="1270" y="586" fill="#536965" font-size="23" font-weight="400" text-anchor="start">请求上下文，返回决策</text>
