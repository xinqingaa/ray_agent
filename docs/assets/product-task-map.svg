<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">RayAgent：从用户目标到可用成果</title>
<desc id="desc">用户提交目标与资料，Agent 通过单循环决策与工具反馈推进，返回答复与文件，并说明完成成果和缺口。计划与控制、沙箱工具、外部协作、项目与记忆支撑执行。</desc>
<style>text { font-family: 'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Songti SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif; fill:#17263c; } .sub { fill:#63748a; } </style>
