<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">发送之后，请求怎样走完</title>
<desc id="desc">页面发出目标后，规划与工具循环在程序中推进，行动在沙箱或 MCP/A2A 落地；进度以事件回到页面，选定文件再同步为附件。单向交接，不是部署拓扑。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 Z" fill="#2563eb"/></marker>
</defs>
<rect data-graph-role="background" width="1600" height="900" fill="#f3f6fa"/>
<text x="48" y="54" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">RAYAGENT / 一次请求</text>
<text x="48" y="108" font-size="38" fill="#17253b" font-weight="600" text-anchor="start">发送之后，请求怎样走完</text>

<rect data-graph-role="container" x="48" y="156" width="300" height="628" rx="12" fill="#edf1f6"/>
<text x="72" y="204" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">你这边</text>
<rect id="t-req" data-graph-role="node" x="78" y="248" width="240" height="120" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="198" y="292" font-size="22" fill="#17253b" font-weight="600" text-anchor="middle">页面发出目标</text>
<text x="198" y="332" font-size="18" fill="#526174" font-weight="400" text-anchor="middle">例如写入 hello.txt</text>
<rect id="t-aside" data-graph-role="node" x="78" y="428" width="240" height="120" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="198" y="472" font-size="22" fill="#17253b" font-weight="600" text-anchor="middle">回复或停止</text>
<text x="198" y="512" font-size="18" fill="#526174" font-weight="400" text-anchor="middle">提问时作答，也可中止</text>
<rect id="t-keep" data-graph-role="node" x="78" y="608" width="240" height="120" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="198" y="652" font-size="22" fill="#17253b" font-weight="600" text-anchor="middle">刷新后还在</text>
<text x="198" y="692" font-size="18" fill="#526174" font-weight="400" text-anchor="middle">会话历史仍可打开</text>

<rect data-graph-role="container" x="398" y="156" width="802" height="628" rx="12" fill="#eaf1fc"/>
<text x="422" y="204" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">规划与执行</text>
<rect id="t-plan" data-graph-role="node" x="430" y="248" width="738" height="120" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="454" y="292" font-size="20" fill="#526174" font-weight="400" text-anchor="start">Planner</text>
<text x="454" y="332" font-size="24" fill="#17253b" font-weight="600" text-anchor="start">拆成步骤，并在过程中更新计划</text>
<rect id="t-loop" data-graph-role="node" x="430" y="428" width="738" height="120" rx="10" fill="#eff6ff" stroke="#8cabdb" stroke-width="3"/>
<text x="454" y="472" font-size="20" fill="#526174" font-weight="400" text-anchor="start">ReAct</text>
<text x="454" y="512" font-size="24" fill="#17253b" font-weight="600" text-anchor="start">调模型与工具，把结果写回下一步</text>
<rect id="t-env" data-graph-role="node" x="430" y="608" width="738" height="120" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="454" y="652" font-size="20" fill="#526174" font-weight="400" text-anchor="start">落地位置</text>
<text x="454" y="692" font-size="24" fill="#17253b" font-weight="600" text-anchor="start">沙箱、浏览器，或 MCP / A2A</text>

<rect data-graph-role="container" x="1250" y="156" width="302" height="628" rx="12" fill="#edf1f6"/>
<text x="1274" y="204" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">回到你这边</text>
<rect id="t-ui" data-graph-role="node" x="1274" y="248" width="254" height="120" rx="10" fill="#ffffff" stroke="#c8d5e5" stroke-width="3"/>
<text x="1401" y="292" font-size="22" fill="#17253b" font-weight="600" text-anchor="middle">进度回到页面</text>
<text x="1401" y="332" font-size="18" fill="#526174" font-weight="400" text-anchor="middle">计划、工具记录、消息</text>
<rect id="t-file" data-graph-role="node" x="1274" y="608" width="254" height="120" rx="10" fill="#f5fcf8" stroke="#8bc5a9" stroke-width="3"/>
<text x="1401" y="652" font-size="22" fill="#17253b" font-weight="600" text-anchor="middle">附件可下载</text>
<text x="1401" y="692" font-size="18" fill="#526174" font-weight="400" text-anchor="middle">同步后的文件副本</text>

<path data-graph-role="edge" id="te-send" d="M318 308 H430" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="374" y="294" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">发送</text>
<path data-graph-role="edge" id="te-plan-loop" d="M799 368 V428" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="te-loop-env" d="M799 548 V608" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="te-progress" d="M1168 308 H1274" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1221" y="294" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">事件</text>
<path data-graph-role="edge" id="te-ui-file" d="M1401 368 V608" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<path data-graph-role="edge" id="te-artifact" d="M1168 668 H1274" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<text x="1221" y="654" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">同步</text>

<text x="48" y="848" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">单向交接，不是部署图</text>
<text x="1552" y="848" font-size="20" fill="#64748b" font-weight="400" text-anchor="end">模块边界见正文</text>
</svg>
