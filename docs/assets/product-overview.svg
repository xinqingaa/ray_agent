  <text x="64" y="868" fill="#536965" font-size="20" font-weight="400" text-anchor="start">蓝：上下文输入　　金：控制与观察　　紫：沙箱执行　　红：外部协议</text>
  <text x="64" y="904" fill="#536965" font-size="22" font-weight="400" text-anchor="start">箭头指向动作发生的一方；只有控制与观察是双向的——用户可以在运行中介入。</text>
