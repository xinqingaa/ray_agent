  <text x="1212" y="312" fill="#20312f" font-size="26" font-weight="600" text-anchor="start">工具与环境</text>
  <text x="1160" y="346" fill="#536965" font-size="20" font-weight="400" text-anchor="start">沙箱内的文件与终端</text>
  <text x="1160" y="378" fill="#536965" font-size="20" font-weight="400" text-anchor="start">浏览器与网页检索</text>
  <text x="1160" y="410" fill="#536965" font-size="20" font-weight="400" text-anchor="start">产物同步为可下载附件</text>
