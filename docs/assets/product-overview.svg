  <text x="1212" y="508" fill="#20312f" font-size="26" font-weight="600" text-anchor="start">外部协作</text>
  <text x="1160" y="542" fill="#536965" font-size="20" font-weight="400" text-anchor="start">MCP 接入外部服务工具</text>
  <text x="1160" y="574" fill="#536965" font-size="20" font-weight="400" text-anchor="start">A2A 委派远程 Agent</text>
  <text x="1160" y="606" fill="#536965" font-size="20" font-weight="400" text-anchor="start">结果回到本地继续执行</text>
