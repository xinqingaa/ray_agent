  </g>
  <text x="140" y="312" fill="#20312f" font-size="26" font-weight="600" text-anchor="start">上下文与记忆</text>
  <text x="88" y="346" fill="#536965" font-size="20" font-weight="400" text-anchor="start">按角色装配模型输入</text>
  <text x="88" y="378" fill="#536965" font-size="20" font-weight="400" text-anchor="start">保存会话与执行历史</text>
  <text x="88" y="410" fill="#536965" font-size="20" font-weight="400" text-anchor="start">步骤边界做定点清理</text>
  <rect x="64" y="464" width="400" height="180" rx="10" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <g transform="translate(88 480) scale(1.5)" fill="none" stroke="#97691f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
    <path d="M2 12H6L9 4L14 20L17 12H22" />
  </g>
  <text x="140" y="508" fill="#20312f" font-size="26" font-weight="600" text-anchor="start">控制与观察</text>
  <text x="88" y="542" fill="#536965" font-size="20" font-weight="400" text-anchor="start">计划、步骤与工具记录</text>
  <text x="88" y="574" fill="#536965" font-size="20" font-weight="400" text-anchor="start">运行中补充要求或停止</text>
  <text x="88" y="606" fill="#536965" font-size="20" font-weight="400" text-anchor="start">Agent 可提问并等待回复</text>
