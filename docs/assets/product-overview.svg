  <text x="628" y="328" fill="#20312f" font-size="46" font-weight="650" text-anchor="start">RayAgent</text>
  <text x="556" y="366" fill="#536965" font-size="24" font-weight="400" text-anchor="start">把一次模型判断变成一项可交付的任务</text>
  <path d="M556 392 L1044 392" fill="none" stroke="#a9c9b4" stroke-width="2" data-graph-role="decoration" />
  <text x="556" y="434" fill="#177b65" font-size="30" font-weight="600" text-anchor="start">Plan + ReAct 双层循环</text>
  <text x="556" y="474" fill="#536965" font-size="22" font-weight="400" text-anchor="start">外层按计划推进步骤</text>
  <text x="556" y="506" fill="#536965" font-size="22" font-weight="400" text-anchor="start">内层根据工具结果继续决策</text>
  <text x="556" y="538" fill="#536965" font-size="22" font-weight="400" text-anchor="start">两层只在步骤边界交接</text>
  <path d="M556 566 L1044 566" fill="none" stroke="#a9c9b4" stroke-width="2" data-graph-role="decoration" />
  <text x="556" y="606" fill="#536965" font-size="21" font-weight="400" text-anchor="start">动作、反馈与状态全程记录，过程可回看</text>
  <rect x="64" y="268" width="400" height="180" rx="10" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <g transform="translate(88 284) scale(1.5)" fill="none" stroke="#3268bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
