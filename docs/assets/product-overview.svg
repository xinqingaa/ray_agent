<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RayAgent 产品全景</title>
  <desc id="desc">上下文与记忆、控制与观察、工具与环境、外部协作围绕单循环 Agent。</desc>
  <style>text { font-family: 'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Songti SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif; }</style>
  <defs>
    <marker id="arr-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#2563eb"/></marker><marker id="arr-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#16a34a"/></marker><marker id="arr-ea580c" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#ea580c"/></marker><marker id="arr-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#dc2626"/></marker><marker id="arr-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#7c3aed"/></marker><marker id="arr-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#475569"/></marker><marker id="arr-6b7280" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff" data-graph-role="background"/>
  <text x="40" y="36" fill="#16a34a" font-size="14" font-weight="600">RAYAGENT ／ 产品全景</text>
  <text x="40" y="70" fill="#111827" font-size="28" font-weight="700">面向任务执行的 Agent Harness</text>
  <rect x="500" y="100" width="600" height="68" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="goal"/>
  <rect x="508" y="112" width="6" height="44" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="528" y="140.0" fill="#111827" font-size="18" font-weight="600">用户目标、附件与运行中的补充</text>
  <rect x="480" y="208" width="640" height="360" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="core"/>
  <rect x="488" y="220" width="6" height="336" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="508" y="344.0" fill="#16a34a" font-size="26" font-weight="600">单循环 Agent</text>
  <text x="508" y="368.0" fill="#6b7280" font-size="16">一份记忆，调用工具直到给出答复</text>
  <text x="508" y="392.0" fill="#6b7280" font-size="16">update_plan 只记录清单，不按清单调度</text>
  <text x="508" y="416.0" fill="#6b7280" font-size="16">没有工具调用的回复就是最终答复</text>
  <text x="508" y="440.0" fill="#6b7280" font-size="16">事件先落库，页面按序号回看</text>
  <rect x="36" y="208" width="400" height="164" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="memory"/>
  <rect x="44" y="220" width="6" height="140" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="64" y="240" fill="#111827" font-size="16" font-weight="600">上下文与记忆</text>
  <text x="64" y="264" fill="#6b7280" font-size="13">按角色装配提示、历史与工具声明</text>
  <text x="64" y="285" fill="#6b7280" font-size="13">请求前估算容量，越过水位先压缩</text>
  <text x="64" y="306" fill="#6b7280" font-size="13">超长结果写入沙箱，模型只看预览</text>
  <rect x="36" y="404" width="400" height="164" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="control"/>
  <rect x="44" y="416" width="6" height="140" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="64" y="436" fill="#111827" font-size="16" font-weight="600">控制与观察</text>
  <text x="64" y="460" fill="#6b7280" font-size="13">计划、轮次、工具与运行状态</text>
  <text x="64" y="481" fill="#6b7280" font-size="13">运行中可补充要求，或停止任务</text>
  <text x="64" y="502" fill="#6b7280" font-size="13">提问等待回复；策略可 ask</text>
  <rect x="1164" y="208" width="400" height="164" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3.5" data-graph-role="node" data-node-id="tools"/>
  <rect x="1172" y="220" width="6" height="140" rx="3" fill="#7c3aed" data-graph-role="decoration"/>
  <text x="1192" y="240" fill="#111827" font-size="16" font-weight="600">工具与环境</text>
  <text x="1192" y="264" fill="#6b7280" font-size="13">沙箱中的文件、Shell 与浏览器</text>
  <text x="1192" y="285" fill="#6b7280" font-size="13">以 ubuntu 执行，并设内存与 CPU 配额</text>
  <text x="1192" y="306" fill="#6b7280" font-size="13">交付之后，文件才成为附件</text>
  <rect x="1164" y="404" width="400" height="164" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3.5" data-graph-role="node" data-node-id="external"/>
  <rect x="1172" y="416" width="6" height="140" rx="3" fill="#dc2626" data-graph-role="decoration"/>
  <text x="1192" y="436" fill="#111827" font-size="16" font-weight="600">外部协作</text>
  <text x="1192" y="460" fill="#6b7280" font-size="13">MCP 把外部工具接进同一运行</text>
  <text x="1192" y="481" fill="#6b7280" font-size="13">A2A 委派远程 Agent，结果回本地</text>
  <text x="1192" y="502" fill="#6b7280" font-size="13">策略对调用可 allow、ask 或 deny</text>
  <rect x="480" y="608" width="640" height="68" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="result"/>
  <rect x="488" y="620" width="6" height="44" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="508" y="648.0" fill="#111827" font-size="18" font-weight="600">结果、附件与可回看的会话过程</text>
  <path d="M 800.0 168.0 L 800.0 208.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <path d="M 436.0 290.0 L 480.0 290.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <path d="M 436.0 486.0 L 480.0 486.0" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-ea580c)" marker-start="url(#arr-ea580c)" data-graph-role="edge"/>
  <path d="M 1120.0 290.0 L 1164.0 290.0" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-7c3aed)" data-graph-role="edge"/>
  <path d="M 1120.0 486.0 L 1164.0 486.0" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-dc2626)" data-graph-role="edge"/>
  <path d="M 800.0 568.0 L 800.0 608.0" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-16a34a)" data-graph-role="edge"/>
  <text x="40" y="748" fill="#6b7280" font-size="14" data-graph-role="legend"><tspan fill="#2563eb">蓝</tspan> 上下文输入    <tspan fill="#ea580c">琥珀</tspan> 控制与观察，双向    <tspan fill="#7c3aed">紫</tspan> 沙箱执行    <tspan fill="#dc2626">红</tspan> 外部协议</text>
  <path d="M40 784 H1560" fill="none" stroke="#e5e7eb" stroke-width="2" data-graph-role="decoration"/>
  <text x="40" y="812" fill="#6b7280" font-size="14">箭头指向动作发生的一方。只有控制与观察是双向的：用户可以在运行中补充、答复、审批或停止。</text>
</svg>
