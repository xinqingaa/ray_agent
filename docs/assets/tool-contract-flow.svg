<text x="932" y="553" font-size="29" font-weight="600" fill="#17263c" text-anchor="start" data-graph-role="decoration" data-owner="execute">执行工具</text>
<text x="874" y="591" font-size="23" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="decoration" data-owner="execute">顺序或按条件并发</text>
