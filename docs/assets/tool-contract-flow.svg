<g transform="translate(1142 276) scale(.64)" stroke="#31465d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration" data-owner="request"><path xmlns="http://www.w3.org/2000/svg" d="M31 12V4" fill="none" /><circle xmlns="http://www.w3.org/2000/svg" cx="31" cy="3" r="3" fill="#ffdc92" /><rect xmlns="http://www.w3.org/2000/svg" x="6" y="12" width="50" height="43" rx="15" fill="#fff" /><rect xmlns="http://www.w3.org/2000/svg" x="15" y="24" width="32" height="19" rx="7" fill="#263e59" /><path xmlns="http://www.w3.org/2000/svg" d="M21 33H24M38 33H41" stroke="#fff" /><path xmlns="http://www.w3.org/2000/svg" d="M23 55L18 62M40 55L45 62" fill="none" /></g>
