<text x="80" y="104" font-size="46" font-weight="700" fill="#17263c" text-anchor="start" data-graph-role="label">RayAgent：工具从声明到执行</text>
<text x="80" y="159" font-size="25" font-weight="400" fill="#63748a" text-anchor="start" data-graph-role="label">声明决定模型能看到什么，校验与授权决定调用能否执行</text>
