<path id="execute-feedback" data-graph-role="edge" data-source="execute" data-target="feedback" d="M1130 560H1220" fill="none" stroke="#5394c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path id="rejected-feedback" data-graph-role="edge" data-source="checks" data-target="feedback" d="M710 615V665H1375V615" fill="none" stroke="#5394c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
