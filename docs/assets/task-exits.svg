<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">运行离开执行中的路径</title>
  <desc id="desc">完成、等待、失败、停止与中断五条路径，收尾范围各不相同。</desc>
  <style>text { font-family: 'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Songti SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif; }</style>
  <defs>
    <marker id="arr-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#2563eb"/></marker><marker id="arr-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#16a34a"/></marker><marker id="arr-ea580c" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#ea580c"/></marker><marker id="arr-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#dc2626"/></marker><marker id="arr-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#7c3aed"/></marker><marker id="arr-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#475569"/></marker><marker id="arr-6b7280" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1.5 1.5 L12.5 7 L1.5 12.5 Z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff" data-graph-role="background"/>
  <text x="40" y="36" fill="#16a34a" font-size="14" font-weight="600">RAYAGENT ／ 结束路径</text>
  <text x="40" y="70" fill="#111827" font-size="28" font-weight="700">运行怎样离开执行中</text>
  <rect x="36" y="364" width="210" height="96" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" data-graph-role="node" data-node-id="running"/>
  <rect x="44" y="376" width="6" height="72" rx="3" fill="#2563eb" data-graph-role="decoration"/>
  <text x="64" y="396" fill="#111827" font-size="18" font-weight="600">running</text>
  <text x="64" y="420" fill="#6b7280" font-size="13">单循环执行中</text>
  <rect x="292" y="108" width="620" height="112" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3.5" data-graph-role="node" data-node-id="done"/>
  <rect x="300" y="120" width="6" height="88" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="320" y="140" fill="#16a34a" font-size="16" font-weight="600">完成 · completed</text>
  <text x="320" y="164" fill="#6b7280" font-size="14">触发：回复里没有工具调用</text>
  <text x="320" y="186" fill="#6b7280" font-size="14">收尾：运行进入 completed，终态事件附汇总</text>
  <rect x="944" y="108" width="612" height="112" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="note-done"/>
  <rect x="952" y="120" width="6" height="88" rx="3" fill="#16a34a" data-graph-role="decoration"/>
  <text x="972" y="140" fill="#111827" font-size="15" font-weight="600">注意</text>
  <text x="972" y="164" fill="#6b7280" font-size="14">这是模型的陈述，不是目标达成</text>
  <text x="972" y="186" fill="#6b7280" font-size="14">计划全部勾选也不等于做成</text>
  <path d="M 268.0 164.0 L 292.0 164.0" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-16a34a)" data-graph-role="edge"/>
  <rect x="292" y="232" width="620" height="112" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3.5" data-graph-role="node" data-node-id="wait"/>
  <rect x="300" y="244" width="6" height="88" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="320" y="264" fill="#ea580c" font-size="16" font-weight="600">等待 · waiting</text>
  <text x="320" y="288" fill="#6b7280" font-size="14">提问：原因为空，退出协程后等回复</text>
  <text x="320" y="310" fill="#6b7280" font-size="14">审批：原因为 approval，批准或拒绝后续接</text>
  <rect x="944" y="232" width="612" height="112" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="note-wait"/>
  <rect x="952" y="244" width="6" height="88" rx="3" fill="#ea580c" data-graph-role="decoration"/>
  <text x="972" y="264" fill="#111827" font-size="15" font-weight="600">可续接</text>
  <text x="972" y="288" fill="#6b7280" font-size="14">不是终态。回复或审批后继续同一运行</text>
  <text x="972" y="310" fill="#6b7280" font-size="14">重启后提问仍在；等待审批会被中断</text>
  <path d="M 268.0 288.0 L 292.0 288.0" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-ea580c)" data-graph-role="edge"/>
  <rect x="292" y="356" width="620" height="112" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3.5" data-graph-role="node" data-node-id="fail"/>
  <rect x="300" y="368" width="6" height="88" rx="3" fill="#dc2626" data-graph-role="decoration"/>
  <text x="320" y="388" fill="#dc2626" font-size="16" font-weight="600">失败 · failed</text>
  <text x="320" y="412" fill="#6b7280" font-size="14">max_iterations、output_truncated、model_error</text>
  <text x="320" y="434" fill="#6b7280" font-size="14">context_limit、runner_error</text>
  <rect x="944" y="356" width="612" height="112" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="note-fail"/>
  <rect x="952" y="368" width="6" height="88" rx="3" fill="#dc2626" data-graph-role="decoration"/>
  <text x="972" y="388" fill="#111827" font-size="15" font-weight="600">只结束本次</text>
  <text x="972" y="412" fill="#6b7280" font-size="14">工具调用失败会回填，不走这条路径</text>
  <text x="972" y="434" fill="#6b7280" font-size="14">同一会话仍可以再发消息</text>
  <path d="M 268.0 412.0 L 292.0 412.0" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-dc2626)" data-graph-role="edge"/>
  <rect x="292" y="480" width="620" height="112" rx="8" fill="#ffffff" stroke="#475569" stroke-width="3.5" data-graph-role="node" data-node-id="stop"/>
  <rect x="300" y="492" width="6" height="88" rx="3" fill="#475569" data-graph-role="decoration"/>
  <text x="320" y="512" fill="#475569" font-size="16" font-weight="600">停止 · cancelled</text>
  <text x="320" y="536" fill="#6b7280" font-size="14">触发：用户停止，原因 user_stop</text>
  <text x="320" y="558" fill="#6b7280" font-size="14">收尾：取消协程，再终止沙箱进程组</text>
  <rect x="944" y="480" width="612" height="112" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="note-stop"/>
  <rect x="952" y="492" width="6" height="88" rx="3" fill="#475569" data-graph-role="decoration"/>
  <text x="972" y="512" fill="#111827" font-size="15" font-weight="600">不回滚</text>
  <text x="972" y="536" fill="#6b7280" font-size="14">进程组先 SIGTERM，约 3 秒后 SIGKILL</text>
  <text x="972" y="558" fill="#6b7280" font-size="14">写 cleanup；文件不回滚，沙箱不销毁</text>
  <path d="M 268.0 536.0 L 292.0 536.0" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)" data-graph-role="edge"/>
  <rect x="292" y="604" width="620" height="112" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3.5" data-graph-role="node" data-node-id="intr"/>
  <rect x="300" y="616" width="6" height="88" rx="3" fill="#7c3aed" data-graph-role="decoration"/>
  <text x="320" y="636" fill="#7c3aed" font-size="16" font-weight="600">中断 · interrupted</text>
  <text x="320" y="660" fill="#6b7280" font-size="14">api_restart：running，以及正在等审批</text>
  <text x="320" y="682" fill="#6b7280" font-size="14">runner_lost：库中仍是 running 但没有协程</text>
  <rect x="944" y="604" width="612" height="112" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="3.5" data-graph-role="node" data-node-id="note-intr"/>
  <rect x="952" y="616" width="6" height="88" rx="3" fill="#7c3aed" data-graph-role="decoration"/>
  <text x="972" y="636" fill="#111827" font-size="15" font-weight="600">不自动重跑</text>
  <text x="972" y="660" fill="#6b7280" font-size="14">不终止沙箱里已经启动的进程</text>
  <text x="972" y="682" fill="#6b7280" font-size="14">等待提问的运行保持 waiting，可续接</text>
  <path d="M 268.0 660.0 L 292.0 660.0" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-7c3aed)" data-graph-role="edge"/>
  <path d="M 246.0 412.0 L 268.0 412.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <path d="M 268.0 164.0 L 268.0 660.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-2563eb)" data-graph-role="edge"/>
  <path d="M40 792 H1560" fill="none" stroke="#e5e7eb" stroke-width="2" data-graph-role="decoration"/>
  <text x="40" y="820" fill="#6b7280" font-size="14">取消协程、终止进程组、回收沙箱、回滚文件是四件独立的事。停止只做前两件。</text>
</svg>
