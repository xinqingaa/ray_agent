<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">任务的四条结束路径</title>
  <desc id="desc">完成、等待、失败和停止各有不同的收尾范围，都不能单独证明目标已经达成。</desc>
  <style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}</style>
  <defs>
    <marker id="a-20312f" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L19 10L2 18Z" fill="#20312f" />
    </marker>
    <marker id="b-20312f" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L13 7L2 12Z" fill="#20312f" />
    </marker>
    <marker id="a-3268bf" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L19 10L2 18Z" fill="#3268bf" />
    </marker>
    <marker id="b-3268bf" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L13 7L2 12Z" fill="#3268bf" />
    </marker>
    <marker id="a-177b65" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L19 10L2 18Z" fill="#177b65" />
    </marker>
    <marker id="b-177b65" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L13 7L2 12Z" fill="#177b65" />
    </marker>
    <marker id="a-97691f" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L19 10L2 18Z" fill="#97691f" />
    </marker>
    <marker id="b-97691f" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L13 7L2 12Z" fill="#97691f" />
    </marker>
    <marker id="a-70579c" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L19 10L2 18Z" fill="#70579c" />
    </marker>
    <marker id="b-70579c" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L13 7L2 12Z" fill="#70579c" />
    </marker>
    <marker id="a-bd5254" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L19 10L2 18Z" fill="#bd5254" />
    </marker>
    <marker id="b-bd5254" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L13 7L2 12Z" fill="#bd5254" />
    </marker>
    <marker id="a-536965" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L19 10L2 18Z" fill="#536965" />
    </marker>
    <marker id="b-536965" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 2L13 7L2 12Z" fill="#536965" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="#fafcfb" data-graph-role="background" />
  <text x="64" y="44" fill="#177b65" font-size="18" font-weight="600" text-anchor="start">RAYAGENT ／ 结束路径</text>
  <text x="64" y="94" fill="#20312f" font-size="40" font-weight="650" text-anchor="start">任务有哪几种结束方式</text>
  <rect x="64" y="476" width="320" height="120" rx="12" fill="#f1f6f3" stroke="#a9c9b4" stroke-width="2" data-graph-role="container" />
  <g transform="translate(88 508) scale(1.5)" fill="none" stroke="#177b65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
    <path d="M2 12H6L9 4L14 20L17 12H22" />
  </g>
  <text x="140" y="536" fill="#20312f" font-size="26" font-weight="600" text-anchor="start">任务运行中</text>
  <text x="88" y="572" fill="#536965" font-size="20" font-weight="400" text-anchor="start">外层步骤与内层工具循环</text>
  <path d="M452 275 L452 797" fill="none" stroke="#536965" stroke-width="3" data-graph-role="decoration" />
  <path d="M384 536 L452 536" fill="none" stroke="#536965" stroke-width="3" stroke-linejoin="round" marker-end="url(#b-536965)" data-graph-role="edge" />
  <rect x="520" y="200" width="1016" height="150" rx="12" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <rect x="520" y="200" width="8" height="150" rx="4" fill="#177b65" stroke="#177b65" stroke-width="0" data-graph-role="node" />
  <g transform="translate(552 214) scale(1.5)" fill="none" stroke="#177b65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
    <path d="M4 12L10 18L20 6" />
  </g>
  <text x="604" y="242" fill="#177b65" font-size="26" font-weight="650" text-anchor="start">完成</text>
  <text x="552" y="286" fill="#536965" font-size="20" font-weight="400" text-anchor="start">触发：没有待办步骤，进入总结</text>
  <text x="552" y="320" fill="#536965" font-size="20" font-weight="400" text-anchor="start">收尾：写入完成状态与终态事件</text>
  <rect x="1104" y="220" width="408" height="110" rx="10" fill="#edf6ef" stroke="#a9c9b4" stroke-width="2" data-graph-role="node" />
  <text x="1128" y="250" fill="#177b65" font-size="19" font-weight="600" text-anchor="start">注意</text>
  <text x="1128" y="282" fill="#536965" font-size="19" font-weight="400" text-anchor="start">计划完成不等于目标达成，</text>
  <text x="1128" y="312" fill="#536965" font-size="19" font-weight="400" text-anchor="start">还要确认产物是否真的交付</text>
  <path d="M452 275 L520 275" fill="none" stroke="#177b65" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-177b65)" data-graph-role="edge" />
  <rect x="520" y="374" width="1016" height="150" rx="12" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <rect x="520" y="374" width="8" height="150" rx="4" fill="#97691f" stroke="#97691f" stroke-width="0" data-graph-role="node" />
  <g transform="translate(552 388) scale(1.5)" fill="none" stroke="#97691f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
    <path d="M16 6A4 4 0 1 1 8 6A4 4 0 1 1 16 6" />
    <path d="M3 22V19Q3 13 12 13Q21 13 21 19V22" />
  </g>
  <text x="604" y="416" fill="#97691f" font-size="26" font-weight="650" text-anchor="start">等待</text>
  <text x="552" y="460" fill="#536965" font-size="20" font-weight="400" text-anchor="start">触发：Agent 调用提问工具</text>
  <text x="552" y="494" fill="#536965" font-size="20" font-weight="400" text-anchor="start">收尾：保存等待状态并退出当前运行</text>
  <rect x="1104" y="394" width="408" height="110" rx="10" fill="#faf5ea" stroke="#dcc79c" stroke-width="2" data-graph-role="node" />
  <text x="1128" y="424" fill="#97691f" font-size="19" font-weight="600" text-anchor="start">注意</text>
  <text x="1128" y="456" fill="#536965" font-size="19" font-weight="400" text-anchor="start">回复到来时重新组装运行器继续，</text>
  <text x="1128" y="486" fill="#536965" font-size="19" font-weight="400" text-anchor="start">不唤醒原来的协程</text>
  <path d="M452 449 L520 449" fill="none" stroke="#97691f" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-97691f)" data-graph-role="edge" />
  <rect x="520" y="548" width="1016" height="150" rx="12" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <rect x="520" y="548" width="8" height="150" rx="4" fill="#bd5254" stroke="#bd5254" stroke-width="0" data-graph-role="node" />
  <g transform="translate(552 562) scale(1.5)" fill="none" stroke="#bd5254" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
    <path d="M12 2A10 10 0 1 1 12 22A10 10 0 1 1 12 2" />
    <path d="M12 7V13" />
    <path d="M12 17H12.01" />
  </g>
  <text x="604" y="590" fill="#bd5254" font-size="26" font-weight="650" text-anchor="start">失败</text>
  <text x="552" y="634" fill="#536965" font-size="20" font-weight="400" text-anchor="start">触发：响应解析异常、模型报错、假完成守卫命中</text>
  <text x="552" y="668" fill="#536965" font-size="20" font-weight="400" text-anchor="start">收尾：写入失败状态，整个流程中止</text>
  <rect x="1104" y="568" width="408" height="110" rx="10" fill="#fbf0f0" stroke="#e2bcbc" stroke-width="2" data-graph-role="node" />
  <text x="1128" y="598" fill="#bd5254" font-size="19" font-weight="600" text-anchor="start">注意</text>
  <text x="1128" y="630" fill="#536965" font-size="19" font-weight="400" text-anchor="start">不进入计划更新，</text>
  <text x="1128" y="660" fill="#536965" font-size="19" font-weight="400" text-anchor="start">已发生的副作用不会回滚</text>
  <path d="M452 623 L520 623" fill="none" stroke="#bd5254" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-bd5254)" data-graph-role="edge" />
  <rect x="520" y="722" width="1016" height="150" rx="12" fill="#ffffff" stroke="#c6d5d0" stroke-width="2" data-graph-role="node" />
  <rect x="520" y="722" width="8" height="150" rx="4" fill="#20312f" stroke="#20312f" stroke-width="0" data-graph-role="node" />
  <g transform="translate(552 736) scale(1.5)" fill="none" stroke="#20312f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-graph-role="decoration">
    <path d="M12 2A10 10 0 1 1 12 22A10 10 0 1 1 12 2" />
    <path d="M8 8H16V16H8Z" />
  </g>
  <text x="604" y="764" fill="#20312f" font-size="26" font-weight="650" text-anchor="start">停止</text>
  <text x="552" y="808" fill="#536965" font-size="20" font-weight="400" text-anchor="start">触发：用户请求停止</text>
  <text x="552" y="842" fill="#536965" font-size="20" font-weight="400" text-anchor="start">收尾：取消执行协程，写入与完成相同的状态和事件</text>
  <rect x="1104" y="742" width="408" height="110" rx="10" fill="#eef1f0" stroke="#b8c6c2" stroke-width="2" data-graph-role="node" />
  <text x="1128" y="772" fill="#20312f" font-size="19" font-weight="600" text-anchor="start">注意</text>
  <text x="1128" y="804" fill="#536965" font-size="19" font-weight="400" text-anchor="start">会话状态没有取消态，沙箱进程</text>
  <text x="1128" y="834" fill="#536965" font-size="19" font-weight="400" text-anchor="start">与已写入的文件都不受影响</text>
  <path d="M452 797 L520 797" fill="none" stroke="#20312f" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-20312f)" data-graph-role="edge" />
  <path d="M64 900 L1536 900" fill="none" stroke="#c6d5d0" stroke-width="2" data-graph-role="decoration" />
  <text x="64" y="938" fill="#536965" font-size="22" font-weight="400" text-anchor="start">停止不会向下传播：取消调度协程、终止沙箱进程、回收环境、撤销已写入的文件，是四件独立的事。</text>
</svg>
