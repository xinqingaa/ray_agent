<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城市知识小练习</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f4f6fb;
    color: #1f2430;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .sub { margin: 0 0 20px; color: #5b6474; font-size: 15px; }

  .cards-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .btn-plain {
    font: inherit; padding: 7px 14px; border-radius: 999px;
    border: 1px solid #c9d0dd; background: #fff; color: #1f2430; cursor: pointer;
  }
  .btn-plain:hover { border-color: #8fa4c8; background: #f2f6ff; }
  .btn-plain:focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .card {
    background: #fff; border: 1px solid #dfe3ec; border-radius: 12px;
    padding: 14px 16px; min-width: 0;
  }
  .card h2 { font-size: 17px; margin: 0 0 6px; }
  .fact { margin: 0; font-size: 14px; color: #3b4354; overflow-wrap: anywhere; }
  .fact strong { color: #1f2430; }
  .card.is-collapsed .fact { display: none; }

  .question {
    background: #fff; border: 1px solid #dfe3ec; border-radius: 12px;
    padding: 14px 16px; margin-top: 14px; min-width: 0;
  }
  .q-text { font-size: 16px; margin: 0 0 10px; overflow-wrap: anywhere; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    font: inherit; width: 100%; text-align: left; padding: 10px 14px;
    border-radius: 10px; border: 1px solid #c9d0dd; background: #fbfcfe;
    color: #1f2430; cursor: pointer; overflow-wrap: anywhere;
  }
  .option:hover:not(:disabled) { border-color: #8fa4c8; background: #f2f6ff; }
  .option:focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .option.is-correct { border-color: #1a7f37; background: #e9f7ee; color: #14602a; font-weight: 600; }
  .option.is-wrong { border-color: #b42318; background: #fdecea; color: #8f1d14; }
  .feedback { margin: 10px 0 0; font-size: 14px; min-height: 22px; color: #3b4354; }

  .scorebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 16px; }
  .score { margin: 0; font-weight: 600; }
  .btn-reset {
    font: inherit; padding: 8px 18px; border-radius: 999px;
    border: 1px solid #2a5bd7; background: #2a5bd7; color: #fff; cursor: pointer;
  }
  .btn-reset:hover { background: #1f47ad; border-color: #1f47ad; }
  .btn-reset:focus-visible { outline: 2px solid #1f47ad; outline-offset: 2px; }
  .summary { margin: 10px 0 0; font-size: 15px; min-height: 23px; color: #2a3550; }

  @media (max-width: 560px) {
    .wrap { padding: 16px 12px 32px; }
    h1 { font-size: 20px; }
    .cards { grid-template-columns: minmax(0, 1fr); }
    .card, .question { padding: 12px 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>城市知识小练习</h1>
    <p class="sub">先看看下面的知识卡，再完成两道选择题。</p>
  </header>

  <div class="cards-toolbar">
    <button id="expand-all" type="button" class="btn-plain" aria-pressed="true">展开全部知识卡</button>
    <button id="collapse-all" type="button" class="btn-plain" aria-pressed="false">收起全部知识卡</button>
  </div>

  <section class="cards" aria-label="知识卡">
    <article class="card">
      <h2>北京</h2>
      <p class="fact">北京是<strong>中国</strong>的首都。</p>
    </article>
    <article class="card">
      <h2>巴黎</h2>
      <p class="fact">巴黎是<strong>法国</strong>的首都。</p>
    </article>
    <article class="card">
      <h2>东京</h2>
      <p class="fact">东京是<strong>日本</strong>的首都。</p>
    </article>
  </section>

  <section class="quiz" aria-label="选择题">
    <div id="questions"></div>
    <div class="scorebar">
      <p id="score" class="score" aria-live="polite">已答 0 / 2 · 得分 0 / 2</p>
      <button id="reset" type="button" class="btn-reset">重做</button>
    </div>
    <p id="summary" class="summary" aria-live="polite"></p>
  </section>
</div>

<script>
(function () {
  var QUESTIONS = [
    { text: '法国的首都是哪座城市？', options: ['北京', '巴黎', '东京'], answer: '巴黎' },
    { text: '中国的首都是哪座城市？', options: ['东京', '北京', '巴黎'], answer: '北京' }
  ];
  var TOTAL = QUESTIONS.length;

  var questionsEl = document.getElementById('questions');
  var scoreEl = document.getElementById('score');
  var summaryEl = document.getElementById('summary');
  var resetEl = document.getElementById('reset');

  var answers = new Array(TOTAL).fill(null);

  function build() {
    questionsEl.innerHTML = '';
    QUESTIONS.forEach(function (q, qi) {
      var item = document.createElement('div');
      item.className = 'question';
      item.dataset.qindex = String(qi);

      var title = document.createElement('h3');
      title.className = 'q-text';
      title.textContent = (qi + 1) + '. ' + q.text;
      item.appendChild(title);

      var list = document.createElement('div');
      list.className = 'options';
      q.options.forEach(function (opt) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option';
        btn.dataset.option = opt;
        btn.textContent = opt;
        btn.addEventListener('click', function () { choose(qi, opt); });
        list.appendChild(btn);
      });
      item.appendChild(list);

      var fb = document.createElement('p');
      fb.className = 'feedback';
      fb.setAttribute('aria-live', 'polite');
      fb.textContent = '';
      item.appendChild(fb);

      questionsEl.appendChild(item);
    });
  }

  function choose(qi, choice) {
    if (answers[qi] !== null) { return; }   // 已答题目：锁定，不可更改
    answers[qi] = choice;
    paint(qi);
    updateScore();
  }

  function paint(qi) {
    var item = questionsEl.querySelector('[data-qindex="' + qi + '"]');
    if (!item) { return; }
    var q = QUESTIONS[qi];
    var choice = answers[qi];
    var correct = choice === q.answer;

    Array.prototype.forEach.call(item.querySelectorAll('.option'), function (btn) {
      var opt = btn.dataset.option;
      btn.disabled = true;
      if (opt === q.answer) { btn.classList.add('is-correct'); }
      if (opt === choice && !correct) { btn.classList.add('is-wrong'); }
    });

    item.querySelector('.feedback').textContent = correct
      ? '答对了！' + q.answer + '是正确答案。'
      : '答错了，正确答案是' + q.answer + '。';
  }

  function updateScore() {
    var answered = 0;
    var score = 0;
    answers.forEach(function (a, qi) {
      if (a !== null) { answered += 1; }
      if (a !== null && a === QUESTIONS[qi].answer) { score += 1; }
    });

    scoreEl.textContent = '已答 ' + answered + ' / ' + TOTAL + ' · 得分 ' + score + ' / ' + TOTAL;

    if (answered === TOTAL) {
      summaryEl.textContent = '本轮结束：你答对了 ' + score + ' / ' + TOTAL + ' 题。'
        + (score === TOTAL ? '全部正确！' : '可以点“重做”再练一次。');
    } else {
      summaryEl.textContent = '';
    }
  }

  function reset() {
    answers = new Array(TOTAL).fill(null);
    build();
    updateScore();
    summaryEl.textContent = '';
  }

  resetEl.addEventListener('click', reset);

  // 知识卡展开 / 收起（按钮为原生 button，可用 Tab 聚焦、Enter 或空格触发）
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var expandBtn = document.getElementById('expand-all');
  var collapseBtn = document.getElementById('collapse-all');

  function setAllCards(expanded) {
    cards.forEach(function (card) {
      card.classList.toggle('is-collapsed', !expanded);
      var fact = card.querySelector('.fact');
      if (fact) { fact.setAttribute('aria-hidden', expanded ? 'false' : 'true'); }
    });
    expandBtn.setAttribute('aria-pressed', String(expanded));
    collapseBtn.setAttribute('aria-pressed', String(!expanded));
  }

  expandBtn.addEventListener('click', function () { setAllCards(true); });
  collapseBtn.addEventListener('click', function () { setAllCards(false); });
  setAllCards(true);

  build();
  updateScore();
})();
</script>
</body>
</html>
